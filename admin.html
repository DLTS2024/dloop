<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - D Loop 3D Stock, Orders & Shiprocket Logistics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,Arial,sans-serif;background:#0a0a0b;color:#e8e8e8;padding:20px;min-height:100vh}
    
    .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #1a1a1e}
    .admin-header h2{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#00f2fe,#4facfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .admin-header .subtitle{color:#6b7280;font-size:0.82rem;margin-top:2px}
    
    .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
    .tabs button{background:#141418;color:#9ca3af;border:1px solid #1f1f24;padding:10px 18px;cursor:pointer;border-radius:8px;font-weight:600;font-size:0.88rem;transition:all 0.2s}
    .tabs button:hover{background:#1a1a20;color:#fff}
    .tabs button.active{background:linear-gradient(135deg,#00b4d8,#0077b6);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(0,180,216,0.25)}
    
    .panel{background:#111114;padding:20px;border:1px solid #1a1a1e;border-radius:12px;min-height:400px}
    
    table{width:100%;border-collapse:collapse;font-size:0.88rem}
    th{text-align:left;padding:10px 12px;border-bottom:2px solid #1f1f24;color:#6b7280;font-weight:700;text-transform:uppercase;font-size:0.75rem;letter-spacing:0.5px}
    td{padding:10px 12px;border-bottom:1px solid #151518}
    tr:hover{background:rgba(255,255,255,0.02)}
    
    .muted{color:#6b7280}
    .small{font-size:0.85em}
    
    .btn{border:none;padding:7px 14px;cursor:pointer;border-radius:6px;font-weight:600;font-size:0.82rem;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
    .btn-success{background:#10b981;color:#fff}
    .btn-success:hover{background:#059669}
    .btn-primary{background:#3b82f6;color:#fff}
    .btn-primary:hover{background:#2563eb}
    .btn-purple{background:#733dd8;color:#fff}
    .btn-purple:hover{background:#5c2bb8}
    .btn-warning{background:#f59e0b;color:#000}
    .btn-warning:hover{background:#d97706}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-danger:hover{background:#dc2626}
    .btn-outline{background:transparent;border:1px solid #333;color:#9ca3af}
    .btn-outline:hover{background:#1a1a20;color:#fff}
    .btn-sm{padding:5px 10px;font-size:0.78rem}
    
    input,select,textarea{padding:8px 12px;background:#0a0a0b;border:1px solid #252528;color:#e8e8e8;border-radius:6px;font-family:inherit;font-size:0.88rem}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,0.15)}
    
    .form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .form-row label{min-width:120px;color:#9ca3af;font-size:0.82rem;font-weight:600}
    .form-row input,.form-row select,.form-row textarea{flex:1;min-width:140px}
    
    /* List-style view for filaments */
    .list-item{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid #151518;transition:background 0.15s}
    .list-item:hover{background:rgba(255,255,255,0.02)}
    .swatch{width:32px;height:32px;border-radius:6px;border:1px solid #252528;flex:0 0 32px;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
    .item-info{flex:1}
    .item-name{font-weight:700;font-size:0.92rem}
    .item-meta{color:#6b7280;font-size:0.82rem;margin-top:2px}
    .item-actions{flex:0 0 auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
    .price{color:#10b981;font-weight:800;margin-right:8px;font-size:0.95rem}
    
    /* Order cards */
    .order-card{background:#141418;border:1px solid #1a1a1e;border-radius:10px;padding:16px;margin-bottom:14px;transition:border-color 0.2s}
    .order-card:hover{border-color:#252528}
    .order-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
    .order-id{font-weight:800;color:#3b82f6;font-size:1.05rem}
    .order-customer{font-weight:600;margin-bottom:6px;font-size:0.95rem;color:#fff}
    .order-detail{color:#9ca3af;font-size:0.82rem;line-height:1.6}
    .order-items-list{margin:10px 0;padding:10px;background:rgba(255,255,255,0.02);border-radius:6px;font-size:0.85rem}
    .order-items-list div{padding:3px 0;border-bottom:1px solid #151518}
    .order-items-list div:last-child{border-bottom:none}
    
    .shiprocket-order-strip{background:rgba(115,61,216,0.1);border:1px solid rgba(115,61,216,0.3);border-radius:8px;padding:10px 14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .sr-logo-badge{background:#733dd8;color:#fff;font-weight:800;font-size:0.75rem;padding:2px 6px;border-radius:4px}
    .awb-text{font-family:monospace;background:rgba(0,0,0,0.4);padding:2px 6px;border-radius:4px;color:#00f2fe;font-size:0.85rem}

    .order-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
    
    .status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
    .status-new{background:rgba(59,130,246,0.15);color:#60a5fa}
    .status-processing{background:rgba(245,158,11,0.15);color:#fbbf24}
    .status-shipped{background:rgba(139,92,246,0.15);color:#a78bfa}
    .status-delivered{background:rgba(16,185,129,0.15);color:#34d399}

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
    .stat-box{background:#141418;border:1px solid #1a1a1e;border-radius:10px;padding:14px;text-align:center}
    .stat-box .stat-val{font-size:1.5rem;font-weight:800;color:#fff}
    .stat-box .stat-label{font-size:0.75rem;color:#6b7280;margin-top:2px;text-transform:uppercase;letter-spacing:0.3px}
    
    .back-link{color:#6b7280;text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:4px}
    .back-link:hover{color:#fff}

    .logout-btn{position:fixed;top:12px;right:12px;z-index:100}
    .filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}

    /* Modal for AWB Assignment */
    .admin-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000}
    .admin-modal-overlay.open{display:flex}
    .admin-modal{background:#141418;border:1px solid #252528;border-radius:12px;padding:24px;max-width:500px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.8)}
  </style>
</head>
<body>

    <div>

      <div class="subtitle">Live Stock Management, Orders & Shiprocket Logistics</div>
    </div>
    <div style="display:flex; gap:12px; align-items:center;">

        <h3 style="font-size:1.1rem; color:#fff;" id="dispatch-modal-title">🚚 Assign Shiprocket AWB Tracking</h3>
        <button onclick="closeDispatchModal()" style="background:transparent; border:none; color:#9ca3af; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <div style="margin-bottom:14px; font-size:0.85rem; color:#9ca3af;" id="dispatch-order-info"></div>

      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:0.8rem; color:#9ca3af; font-weight:600; margin-bottom:4px;">Shiprocket AWB / Tracking Number *</label>

        <button type="button" class="btn btn-purple" onclick="saveDispatchAWB()">🚀 Save AWB & Dispatch</button>

      // 10. ABS-FR Fire Retardant (1 color)

      // 11. Tough ABS Pro (2 colors)

      { name: 'Pure White', category: 'ABS', color: '#FAFAFA', balance: 14000, price: 810, reorder: 4000, productId: 'fil-abs-std' }
    ];

    // Admin client-side authentication
    const ADMIN_HASH_KEY = 'dl3d_admin_hash';
    const ADMIN_SESSION_KEY = 'dl3d_admin_auth';
    const SHIPROCKET_CONFIG_KEY = 'dl3d_shiprocket_cfg';

    async function hashPwd(pwd){
      const enc = new TextEncoder().encode(pwd);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    function isAuthed(){ return sessionStorage.getItem(ADMIN_SESSION_KEY) === '1'; }

    async function ensureAuth(){
      const content = document.getElementById('content');
      function showSetup(){
        content.innerHTML = `<div style="max-width:400px;margin:60px auto;text-align:center">
          <h3 style="margin-bottom:16px;font-size:1.2rem">Set Admin Password</h3>
          <p class="muted small" style="margin-bottom:16px">First time setup. Create your admin password.</p>
          <input id="adm_pwd" placeholder="New password" type="password" style="width:100%;margin-bottom:10px;padding:12px">
          <button id="adm_set" class="btn btn-primary" style="width:100%;padding:12px">Set Password & Enter</button>
        </div>`;
        document.getElementById('adm_set').addEventListener('click', async ()=>{
          const p = document.getElementById('adm_pwd').value;
          if(!p) return alert('Enter a password');
          const h = await hashPwd(p);
          localStorage.setItem(ADMIN_HASH_KEY, h);
          sessionStorage.setItem(ADMIN_SESSION_KEY, '1');
          startAdmin();
        });
      }

      function showLogin(){
        content.innerHTML = `<div style="max-width:400px;margin:60px auto;text-align:center">
          <h3 style="margin-bottom:16px;font-size:1.2rem">🔒 Admin Login</h3>
          <input id="adm_pwd" placeholder="Password" type="password" style="width:100%;margin-bottom:10px;padding:12px">
          <button id="adm_login" class="btn btn-primary" style="width:100%;padding:12px">Login</button>
        </div>`;
        document.getElementById('adm_login').addEventListener('click', async ()=>{
          const p = document.getElementById('adm_pwd').value;
          if(!p) return alert('Enter password');
          const match = await verifyPwd(p);
          if(match){ sessionStorage.setItem(ADMIN_SESSION_KEY,'1'); startAdmin(); }
          else alert('Incorrect password');
        });
        document.getElementById('adm_pwd').addEventListener('keydown', async (e)=>{
          if(e.key==='Enter'){ document.getElementById('adm_login').click(); }
        });
      }

      async function verifyPwd(p){ const h = await hashPwd(p); return h === localStorage.getItem(ADMIN_HASH_KEY); }

      if(isAuthed()) return true;
      if(!localStorage.getItem(ADMIN_HASH_KEY)) { showSetup(); return false; }
      showLogin(); return false;
    }

    function addLogoutButton(){
      if(document.getElementById('adm_logout')) return;
      const b = document.createElement('button');
      b.id = 'adm_logout'; b.className = 'btn btn-outline logout-btn'; b.textContent = '🚪 Logout';
      b.addEventListener('click', ()=>{ sessionStorage.removeItem(ADMIN_SESSION_KEY); location.reload(); });
      document.body.appendChild(b);
    }

    // Global HTML escaping utility
    function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
    window.escapeHTML = escapeHTML;

    // Active order index being dispatched
    window.currentDispatchOrderIdx = null;

    function openDispatchModal(orderIdx){
      window.currentDispatchOrderIdx = orderIdx;
      const state = JSON.parse(localStorage.getItem('dl3d_stock_v1') || '{}');
      const order = (state.orders || [])[orderIdx];
      if(!order) return;

      const titleElem = document.getElementById('dispatch-modal-title');
      const infoElem = document.getElementById('dispatch-order-info');
      const awbInput = document.getElementById('sr_awb_input');
      const courierSelect = document.getElementById('sr_courier_select');
      const modalOverlay = document.getElementById('dispatch-modal-overlay');

      if(titleElem) titleElem.textContent = `🚚 Assign Shiprocket AWB: ${order.orderId || 'Order #' + (orderIdx+1)}`;
      if(infoElem) {
        infoElem.innerHTML = `
          Customer: <strong>${escapeHTML(order.customer)}</strong> (${escapeHTML(order.phone)})<br>
          Destination: <strong>${escapeHTML(order.address)}</strong><br>
          Total Value: <strong>₹${order.total}</strong> (${(order.items||[]).length} item(s))
        `;
      }

      if(awbInput) awbInput.value = order.awb || '';
      if(courierSelect && order.courier_name) courierSelect.value = order.courier_name;
      if(modalOverlay) modalOverlay.classList.add('open');
    }

    function closeDispatchModal(){
      const modalOverlay = document.getElementById('dispatch-modal-overlay');
      if(modalOverlay) modalOverlay.classList.remove('open');
      window.currentDispatchOrderIdx = null;
    }

    function generateAutoAWB(){
      const randomAWB = '143' + Math.floor(100000000 + Math.random() * 900000000);
      const awbInput = document.getElementById('sr_awb_input');
      if(awbInput) awbInput.value = randomAWB;
    }

    function saveDispatchAWB(){
      const awbInput = document.getElementById('sr_awb_input');
      const courierSelect = document.getElementById('sr_courier_select');
      const markShippedCheckbox = document.getElementById('sr_mark_shipped');

      const awb = awbInput ? awbInput.value.trim() : '';
      if(!awb) return alert('Please enter or generate an AWB tracking number.');
      const courier = courierSelect ? courierSelect.value : 'Delhivery Surface';
      const markShipped = markShippedCheckbox ? markShippedCheckbox.checked : true;

      const state = JSON.parse(localStorage.getItem('dl3d_stock_v1') || '{}');
      if(window.currentDispatchOrderIdx !== null && state.orders && state.orders[window.currentDispatchOrderIdx]){
        const order = state.orders[window.currentDispatchOrderIdx];
        order.awb = awb;
        order.courier_name = courier;
        order.tracking_url = `https://shiprocket.co/tracking/${awb}`;
        if(markShipped) order.status = 'shipped';
        order.dispatchedAt = Date.now();

        localStorage.setItem('dl3d_stock_v1', JSON.stringify(state));
        closeDispatchModal();
        alert(`✅ Order ${order.orderId} dispatched with Shiprocket AWB: ${awb} via ${courier}!`);
        
        if (typeof window.refreshAdminOrders === 'function') {
          window.refreshAdminOrders();
        }
      }
    }

    window.openDispatchModal = openDispatchModal;
    window.closeDispatchModal = closeDispatchModal;
    window.generateAutoAWB = generateAutoAWB;
    window.saveDispatchAWB = saveDispatchAWB;

    async function startAdmin(){
      addLogoutButton();

      const STORAGE_KEY = 'dl3d_stock_v1';
      
      function load(){
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if(!raw){
            const init = { filaments: JSON.parse(JSON.stringify(DEFAULT_CATALOG_FILAMENTS)), customs:[], ready:[], orders:[] };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
            return init;
          }
          const parsed = JSON.parse(raw);
          if(!parsed.filaments || parsed.filaments.length < 20){
            parsed.filaments = JSON.parse(JSON.stringify(DEFAULT_CATALOG_FILAMENTS));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          }
          return parsed;
        } catch(e) {
          const init = { filaments: JSON.parse(JSON.stringify(DEFAULT_CATALOG_FILAMENTS)), customs:[], ready:[], orders:[] };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
          return init;
        }
      }

      function save(state){
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch(e) {}
      }

      let state = load();

      function renderSection(name){
        const content = document.getElementById('content');
        document.querySelectorAll('.tabs button').forEach(b=>{
          b.classList.toggle('active', b.getAttribute('data-section')===name);
        });
        if(name==='filaments') renderFilaments(content);
        if(name==='orders') renderOrders(content);
        if(name==='shiprocket') renderShiprocket(content);
        if(name==='customs') renderProducts(content,'customs','Custom 3D Products');
        if(name==='ready') renderProducts(content,'ready','Ready Products');
      }

      // ============================

      // ============================

        const statsHtml = `<div class="stat-grid">

          <div class="stat-box"><div class="stat-val" style="color:#10b981">${totalSpools}</div><div class="stat-label">Total Sealed Spools</div></div>
          <div class="stat-box"><div class="stat-val">${(totalGrams/1000).toFixed(0)} kg</div><div class="stat-label">Total Farm Stock</div></div>
          <div class="stat-box"><div class="stat-val" style="color:${lowStock>0?'#f59e0b':'#10b981'}">${lowStock}</div><div class="stat-label">Low Stock Alerts</div></div>
        </div>`;

        const toolbarHtml = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
            <div class="filter-bar" style="margin-bottom:0;">

                <option value="">All Categories (11)</option>
                <option value="PLA">PLA</option>
                <option value="PLA Matte">PLA Matte</option>
                <option value="PETG">PETG</option>
                <option value="PETG-CF">PETG-CF</option>
                <option value="ASA">ASA</option>
                <option value="PA12-CF">PA12-CF</option>
                <option value="PA12">PA12 Nylon</option>
                <option value="Silk PLA">Silk PLA</option>
                <option value="PLA Special">PLA Special</option>

            </div>

        `;

        const formHtml = `

                <option value="PA12-CF">PA12-CF</option>
                <option value="PA12">PA12 Nylon</option>
                <option value="Silk PLA">Silk PLA</option>
                <option value="PLA Special">PLA Special</option>

              <input id="f_price" placeholder="Price ₹ (e.g. 810)" type="number" style="flex:1">

        root.innerHTML = statsHtml + toolbarHtml + formHtml + '<div id="f_list_wrap"></div>';

        function renderList(){
          state = load();
          const wrap = document.getElementById('f_list_wrap');
          if(!wrap) return;
          wrap.innerHTML = '';

          const search = (document.getElementById('fil_search')?.value || '').toLowerCase().trim();
          const catFilter = document.getElementById('fil_cat_filter')?.value || '';

          const filtered = state.filaments.filter(f => {
            if(catFilter && (f.category || '').toLowerCase() !== catFilter.toLowerCase()) return false;

          if(!filtered.length){
            wrap.innerHTML = '<div class="muted" style="text-align:center;padding:40px">No filaments match your search or filter.</div>';

          filtered.forEach(f => {
            const actualIdx = state.filaments.indexOf(f);
            const b = Number(f.balance||0);

            const item = document.createElement('div');

              <div class="item-actions">
                <button data-idx="${actualIdx}" data-act="inc1" class="btn btn-outline btn-sm" title="Add 1 Spool">+1 Spool</button>

                <button data-idx="${actualIdx}" data-act="inc5" class="btn btn-outline btn-sm" title="Add 5 Spools">+5 Spools</button>

                <button data-idx="${actualIdx}" data-act="del" class="btn btn-danger btn-sm">Delete</button>
              </div>
            `;
            wrap.appendChild(item);
          });
        }

        document.getElementById('fil_search')?.addEventListener('input', renderList);
        document.getElementById('fil_cat_filter')?.addEventListener('change', renderList);

        document.getElementById('btn_reset_catalog')?.addEventListener('click', ()=>{
          if(!confirm('Reset all 52 filaments to the official website catalogue stock numbers? Any custom changes to stock numbers will be refreshed.')) return;
          state.filaments = JSON.parse(JSON.stringify(DEFAULT_CATALOG_FILAMENTS));
          save(state);
          renderFilaments(root);
          alert('✅ Synced all 52 filaments with default catalog stock!');
        });

        root.addEventListener('click', e=>{
          const btn = e.target.closest('button'); if(!btn) return;
          const act = btn.getAttribute('data-act');
          const idx = btn.getAttribute('data-idx');
          if(idx===null || idx===undefined) return;
          state = load();

          if(act==='inc1'){
            state.filaments[idx].balance = (Number(state.filaments[idx].balance)||0) + 1000;
            save(state); renderList();
          }
          if(act==='dec1'){
            state.filaments[idx].balance = Math.max(0, (Number(state.filaments[idx].balance)||0) - 1000);
            save(state); renderList();
          }
          if(act==='inc5'){
            state.filaments[idx].balance = (Number(state.filaments[idx].balance)||0) + 5000;
            save(state); renderList();
          }
          if(act==='del'){
            if(!confirm(`Delete filament "${state.filaments[idx].name}"?`)) return;
            state.filaments.splice(idx,1); save(state); renderFilaments(root);
          }
          if(act==='edit'){
            const f = state.filaments[idx];
            const b = Number(f.balance||0);
            const n1 = Math.floor(b/1000);
            document.getElementById('f_name').value = f.name;
            document.getElementById('f_category').value = f.category||'';
            document.getElementById('f_color').value = f.color||'';
            document.getElementById('f_price').value = f.price||'';
            document.getElementById('f_count_1kg').value = n1;
            document.getElementById('f_reorder').value = f.reorder||3000;
            document.getElementById('f_add').textContent = '💾 Save Changes';
            document.getElementById('f_add').dataset.edit = idx;
            document.getElementById('f_name').focus();
            document.getElementById('f_name').scrollIntoView({ behavior: 'smooth' });
          }
        });

        document.getElementById('f_add')?.addEventListener('click', ()=>{
          state = load();
          const name = document.getElementById('f_name').value.trim();
          if(!name) return alert('Enter filament name');
          const category = document.getElementById('f_category').value;
          if(!category) return alert('Select a material category');
          const color = document.getElementById('f_color').value.trim() || '#121212';
          const count1 = Math.max(0, Number(document.getElementById('f_count_1kg').value)||0);
          const balance = count1 * 1000;
          const reorder = Number(document.getElementById('f_reorder').value)||3000;
          const price = Number(document.getElementById('f_price').value)||810;
          const editIdx = document.getElementById('f_add').dataset.edit;

          if(editIdx!==undefined && editIdx!==''){
            const existing = state.filaments[editIdx] || {};
            state.filaments[editIdx] = {
              name, category, color, balance, price, reorder,
              productId: existing.productId || ('fil-' + category.toLowerCase().replace(/[^a-z0-9]/g,'') + '-std')
            };
            delete document.getElementById('f_add').dataset.edit;
            document.getElementById('f_add').textContent = '+ Add Spool';
          } else {
            state.filaments.push({
              name, category, color, balance, price, reorder,
              productId: 'fil-' + category.toLowerCase().replace(/[^a-z0-9]/g,'') + '-std'
            });
          }

          save(state);
          renderFilaments(root);
          ['f_name','f_color','f_count_1kg','f_price'].forEach(id=>{
            const el = document.getElementById(id); if(el) el.value='';
          });
          document.getElementById('f_category').value = '';
          document.getElementById('f_reorder').value = '3000';
        });
      }

                <div>${escapeHTML(o.item)} × ${o.qty||1} — ₹${o.total||0}</div>
                ${isStl ? `
                  <button type="button" class="btn btn-primary btn-sm" style="padding:4px 10px; font-size:0.75rem;" onclick="downloadStlModel('${escapeHTML(o.orderId)}', '${escapeHTML(o.item)}')">
                    📥 Download STL File
                  </button>
                ` : ''}
              </div>
            `;
          }

          const hasAWB = Boolean(o.awb);

          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-header">
              <div>
                <span class="order-id">${escapeHTML(o.orderId || 'Order #' + (actualIdx+1))}</span>
                <span class="status-badge ${statusClass}" style="margin-left:8px">${statusText}</span>
              </div>
              <div class="muted small">${date}</div>
            </div>
            ${o.customer ? `<div class="order-customer">👤 Customer: <strong>${escapeHTML(o.customer)}</strong></div>` : ''}
            <div class="order-detail">
              ${o.phone ? `📞 Phone: <strong>${escapeHTML(o.phone)}</strong>` : ''}
              ${o.email ? ` · ✉️ ${escapeHTML(o.email)}` : ''}
              ${o.address ? `<br>📍 Shipping Address: <strong>${escapeHTML(o.address)}</strong>` : ''}
              ${o.paymentMethod ? `<br>💰 Payment: <strong>${payText}</strong>` : ''}
            </div>
            ${itemsHtml ? `<div class="order-items-list">${itemsHtml}</div>` : ''}

            <!-- Delivery & Shiprocket Strip -->
            ${o.deliveryMethod === 'pickup' ? `
              <div class="shiprocket-order-strip" style="background:rgba(0,242,254,0.06); border-color:rgba(0,242,254,0.25);">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="sr-logo-badge" style="background:#00f2fe; color:#000; font-weight:800;">🏬 Studio Pickup</span>
                  <span style="color:#38bdf8; font-size:0.85rem; font-weight:700;">Customer will pick up directly at Maduravoyal Studio (Free ₹0)</span>
                </div>
                <span style="font-size:0.75rem; color:#34d399; font-weight:700; background:rgba(52,211,153,0.1); padding:2px 8px; border-radius:999px;">
                  Pickup Ready
                </span>
              </div>
            ` : `
              <div class="shiprocket-order-strip">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="sr-logo-badge">Shiprocket</span>
                  ${hasAWB ? `
                    <span>AWB: <strong class="awb-text">${escapeHTML(o.awb)}</strong> (${escapeHTML(o.courier_name||'Express')})</span>
                  ` : `
                    <span style="color:#fbbf24; font-size:0.82rem;">⚠️ AWB Not Assigned Yet</span>
                  `}
                </div>
                <div style="display:flex; gap:6px;">
                  <button type="button" class="btn btn-purple btn-sm" onclick="openDispatchModal(${actualIdx})">
                    🚚 ${hasAWB ? 'Edit AWB / Courier' : 'Dispatch / Assign AWB'}
                  </button>
                  ${hasAWB ? `
                    <a href="https://shiprocket.co/tracking/${o.awb}" target="_blank" class="btn btn-outline btn-sm">
                      🌐 Live Track ↗
                    </a>
                  ` : ''}
                </div>
              </div>
            `}

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px;">
              <div style="font-weight:800;color:#10b981;font-size:1.1rem">Total Payable: ₹${(o.total||0).toLocaleString()}</div>
              <div class="order-actions">
                ${o.status==='new'? `<button data-oidx="${actualIdx}" data-status="processing" class="btn btn-warning btn-sm">Mark In Production</button>` : ''}
                ${o.status==='processing'? `<button data-oidx="${actualIdx}" data-status="shipped" class="btn btn-primary btn-sm">Mark Shipped</button>` : ''}
                ${o.status==='shipped'? `<button data-oidx="${actualIdx}" data-status="delivered" class="btn btn-success btn-sm">Mark Delivered</button>` : ''}
                <button data-oidx="${actualIdx}" data-status="delete" class="btn btn-danger btn-sm">Delete</button>
              </div>
            </div>
          `;
          list.appendChild(card);
        });

        list.addEventListener('click', e=>{
          const btn = e.target.closest('button[data-status]'); if(!btn) return;
          const oidx = Number(btn.getAttribute('data-oidx'));
          const newStatus = btn.getAttribute('data-status');
          state = load();
          if(newStatus==='delete'){
            if(!confirm('Delete this order record?')) return;
            state.orders.splice(oidx,1);
          } else {
            if(state.orders[oidx]) state.orders[oidx].status = newStatus;
          }
          save(state);
          renderOrders(root);
        });
      }

      // ============================
      // PRODUCTS SECTION (Custom & Ready)
      // ============================
      // ============================
      // READY 3D PRODUCTS MANAGER (1-6 Images, SKU, Specs & Warranty)
      // ============================
      function renderProducts(root, key, title) {
        state = load();

        if (key === 'ready') {
          // If empty, seed from PREPRINTED_PRODUCTS
          if (!state.ready || !Array.isArray(state.ready) || state.ready.length === 0 || !state.ready[0].images) {
            state.ready = (typeof PREPRINTED_PRODUCTS !== 'undefined' ? PREPRINTED_PRODUCTS : []);
            save(state);
          }

          root.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
              <div>
                <h3 style="font-size:1.15rem; color:#fff; margin-bottom:2px;">📦 Pre-Printed 3D Products Catalog</h3>
                <p style="font-size:0.8rem; color:#94a3b8;">Manage ready-to-ship products, 1 to 6 images, live stock, pricing, specs & warranty.</p>
              </div>
              <button class="btn btn-success" onclick="openProductEditModal(-1)">
                ➕ Add New 3D Product
              </button>
            </div>

            <div style="background:#131722; border:1px solid rgba(255,255,255,0.08); border-radius:12px; overflow-x:auto;">
              <table style="width:100%; border-collapse:collapse;">
                <thead>
                  <tr style="border-bottom:1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.3); font-size:0.82rem; text-align:left; color:#94a3b8;">
                    <th style="padding:12px 16px;">Product</th>
                    <th style="padding:12px 14px;">SKU</th>
                    <th style="padding:12px 14px;">Category</th>
                    <th style="padding:12px 14px;">Price</th>
                    <th style="padding:12px 14px;">Stock</th>
                    <th style="padding:12px 14px;">Gallery</th>
                    <th style="padding:12px 16px; text-align:right;">Actions</th>
                  </tr>
                </thead>
                <tbody id="ready_prod_list"></tbody>
              </table>
            </div>

            <!-- Product Edit / Create Modal -->
            <div class="modal-overlay" id="prod-edit-modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; justify-content:center; align-items:center; padding:16px;">
              <div style="background:#131722; border:1px solid rgba(0,242,254,0.3); border-radius:14px; width:100%; max-width:760px; max-height:90vh; overflow-y:auto; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,0.8);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:12px;">
                  <h3 id="pem-title" style="font-size:1.15rem; color:#fff;">Edit Product</h3>
                  <button type="button" class="btn btn-outline btn-sm" onclick="closeProductEditModal()">✕</button>
                </div>

                <form id="prod-edit-form" onsubmit="handleProductSave(event)">
                  <input type="hidden" id="pem-idx">

                  <div style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin-bottom:12px;">
                    <div>
                      <label class="config-label">Product Title *</label>
                      <input type="text" id="pem-name" required placeholder="e.g. Flexi Octopus Magic Green 1 Pcs">
                    </div>
                    <div>
                      <label class="config-label">SKU *</label>
                      <input type="text" id="pem-sku" required placeholder="1879347">
                    </div>
                    <div>
                      <label class="config-label">Category *</label>
                      <input type="text" id="pem-category" required placeholder="3D Printed Toys">
                    </div>
                  </div>

                  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:14px;">
                    <div>
                      <label class="config-label">Selling Price (₹) *</label>
                      <input type="number" id="pem-price" required min="1" placeholder="224">
                    </div>
                    <div>
                      <label class="config-label">MRP (₹) *</label>
                      <input type="number" id="pem-mrp" min="1" placeholder="349">
                    </div>
                    <div>
                      <label class="config-label">Stock Quantity * (0 = Out of Stock)</label>
                      <input type="number" id="pem-stock" required min="0" placeholder="15">
                    </div>
                  </div>

                  <!-- 1 to 6 Images Section -->
                  <div style="background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:16px; margin-bottom:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                      <label class="config-label" style="margin:0;">📸 Product Images (Min 1, Max 6)</label>
                      <span style="font-size:0.75rem; color:#94a3b8;">Enter web URLs or paste image paths</span>
                    </div>

                    <div id="pem-images-container" style="display:flex; flex-direction:column; gap:8px; margin-bottom:10px;">
                      <!-- 1 to 6 image inputs generated dynamically -->
                    </div>

                    <button type="button" class="btn btn-outline btn-sm" id="btn-add-img-slot" onclick="addImageInputSlot('')" style="font-size:0.78rem;">
                      ➕ Add Image Slot (Max 6)
                    </button>
                  </div>

                  <div style="margin-bottom:14px;">
                    <label class="config-label">Short Highlights (One per line)</label>
                    <textarea id="pem-highlights" rows="3" placeholder="Pliable and flexible materials&#10;Magic Green vibrancy&#10;Octopus-shaped print-in-place"></textarea>
                  </div>

                  <div style="margin-bottom:14px;">
                    <label class="config-label">Full Product Description</label>
                    <textarea id="pem-desc" rows="4" placeholder="Detailed product description..."></textarea>
                  </div>

                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;">
                    <div>
                      <label class="config-label">Material & Layer Height</label>
                      <input type="text" id="pem-spec-mat" placeholder="Silk Dual-Color PLA (0.16mm)">
                    </div>
                    <div>
                      <label class="config-label">Dimensions & Weight</label>
                      <input type="text" id="pem-spec-dim" placeholder="110 × 110 × 42 mm | 42 grams">
                    </div>
                  </div>

                  <div style="margin-bottom:16px;">
                    <label class="config-label">Warranty & Replacement Policy</label>
                    <input type="text" id="pem-warranty" placeholder="15 Days Replacement Warranty Against Manufacturing Defect.">
                  </div>

                  <div style="display:flex; justify-content:flex-end; gap:10px; border-top:1px solid rgba(255,255,255,0.08); padding-top:14px;">
                    <button type="button" class="btn btn-secondary" onclick="closeProductEditModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">💾 Save Product</button>
                  </div>
                </form>
              </div>
            </div>
          `;

          window.refreshReadyTable = function() {
            state = load();
            const tbody = document.getElementById('ready_prod_list');
            if (!tbody) return;
            tbody.innerHTML = '';

            const list = state.ready || [];
            if (!list.length) {
              tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:2rem; color:#94a3b8;">No products found. Click "+ Add New 3D Product" to add.</td></tr>`;
              return;
            }

            list.forEach((p, idx) => {
              const tr = document.createElement('tr');
              tr.style.borderBottom = '1px solid rgba(255,255,255,0.04)';
              const thumb = (p.images && p.images.length > 0) ? p.images[0] : (p.img || 'assets/dragon.png');
              const isOut = (p.stock !== undefined && p.stock <= 0);
              const imgCount = (p.images && p.images.length) ? p.images.length : (p.img ? 1 : 0);

              tr.innerHTML = `
                <td style="padding:12px 16px;">
                  <div style="display:flex; align-items:center; gap:12px;">
                    <img src="${thumb}" style="width:44px; height:44px; border-radius:6px; object-fit:cover; background:#000;">
                    <div>
                      <strong style="color:#fff; font-size:0.9rem;">${escapeHTML(p.name)}</strong>
                      <div style="font-size:0.75rem; color:#94a3b8;">${p.highlights ? p.highlights[0] || '' : ''}</div>
                    </div>
                  </div>
                </td>
                <td style="padding:12px 14px; font-size:0.85rem; font-family:monospace; color:#38bdf8;">${escapeHTML(p.sku || p.id)}</td>
                <td style="padding:12px 14px; font-size:0.85rem; color:#94a3b8;">${escapeHTML(p.category || 'Toys')}</td>
                <td style="padding:12px 14px; font-size:0.9rem; font-weight:700; color:#10b981;">₹${p.price}</td>
                <td style="padding:12px 14px;">
                  <span class="status-badge ${isOut ? 'status-cancelled' : 'status-shipped'}" style="font-size:0.75rem;">
                    ${isOut ? '● Out of Stock (0)' : `● In Stock (${p.stock || 10})`}
                  </span>
                </td>
                <td style="padding:12px 14px; font-size:0.8rem; color:#a855f7;">📷 ${imgCount} Image(s)</td>
                <td style="padding:12px 16px; text-align:right;">
                  <div style="display:flex; gap:6px; justify-content:flex-end;">
                    <button class="btn btn-outline btn-sm" onclick="openProductEditModal(${idx})">✏️ Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteReadyProduct(${idx})">🗑️</button>
                  </div>
                </td>
              `;
              tbody.appendChild(tr);
            });
          };

          window.openProductEditModal = function(idx) {
            state = load();
            const overlay = document.getElementById('prod-edit-modal-overlay');
            const form = document.getElementById('prod-edit-form');
            form.reset();
            document.getElementById('pem-images-container').innerHTML = '';

            document.getElementById('pem-idx').value = idx;
            if (idx >= 0 && state.ready && state.ready[idx]) {
              const p = state.ready[idx];
              document.getElementById('pem-title').textContent = `✏️ Edit "${p.name}"`;
              document.getElementById('pem-name').value = p.name || '';
              document.getElementById('pem-sku').value = p.sku || p.id || '';
              document.getElementById('pem-category').value = p.category || '3D Printed Toys';
              document.getElementById('pem-price').value = p.price || 0;
              document.getElementById('pem-mrp').value = p.mrp || p.price || 0;
              document.getElementById('pem-stock').value = p.stock !== undefined ? p.stock : 10;
              document.getElementById('pem-highlights').value = (p.highlights || []).join('\n');
              document.getElementById('pem-desc').value = p.desc || '';
              
              const specs = p.specs || {};
              document.getElementById('pem-spec-mat').value = specs['Material'] || '';
              document.getElementById('pem-spec-dim').value = specs['Dimensions'] || '';
              document.getElementById('pem-warranty').value = p.warranty || '15 Days Replacement Warranty Against Manufacturing Defect.';

              const imgs = p.images && p.images.length ? p.images : [p.img || 'assets/dragon.png'];
              imgs.forEach(url => addImageInputSlot(url));
            } else {
              document.getElementById('pem-title').textContent = '➕ Add New 3D Product';
              document.getElementById('pem-sku').value = `1879${Math.floor(100 + Math.random() * 900)}`;
              document.getElementById('pem-category').value = '3D Printed Toys';
              document.getElementById('pem-price').value = 249;
              document.getElementById('pem-mrp').value = 399;
              document.getElementById('pem-stock').value = 10;
              document.getElementById('pem-warranty').value = '15 Days Replacement Warranty Against Manufacturing Defect.';
              addImageInputSlot('https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=600&q=80');
            }

            overlay.style.display = 'flex';
          };

          window.closeProductEditModal = function() {
            document.getElementById('prod-edit-modal-overlay').style.display = 'none';
          };

          window.addImageInputSlot = function(val = '') {
            const container = document.getElementById('pem-images-container');
            const count = container.children.length;
            if (count >= 6) {
              alert('Maximum 6 images allowed per product.');
              return;
            }
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.gap = '8px';
            div.style.alignItems = 'center';
            div.innerHTML = `
              <span style="font-size:0.75rem; color:#94a3b8; width:65px;">Image ${count + 1}:</span>
              <input type="text" class="pem-img-input" value="${escapeHTML(val)}" placeholder="https://example.com/photo.jpg" style="flex:1;">
              <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()" style="padding:4px 8px;">✕</button>
            `;
            container.appendChild(div);
          };

          window.handleProductSave = function(e) {
            e.preventDefault();
            state = load();
            state.ready = state.ready || [];

            const idx = Number(document.getElementById('pem-idx').value);
            const imgInputs = document.querySelectorAll('.pem-img-input');
            const images = Array.from(imgInputs).map(inp => inp.value.trim()).filter(Boolean);

            if (!images.length) {
              images.push('assets/dragon.png');
            }

            const highlights = document.getElementById('pem-highlights').value.split('\n').map(h => h.trim()).filter(Boolean);
            const matSpec = document.getElementById('pem-spec-mat').value.trim();
            const dimSpec = document.getElementById('pem-spec-dim').value.trim();

            const prodObj = {
              id: idx >= 0 && state.ready[idx] ? state.ready[idx].id : `prod-${Date.now()}`,
              sku: document.getElementById('pem-sku').value.trim(),
              name: document.getElementById('pem-name').value.trim(),
              category: document.getElementById('pem-category').value.trim(),
              price: Number(document.getElementById('pem-price').value) || 0,
              mrp: Number(document.getElementById('pem-mrp').value) || 0,
              stock: Number(document.getElementById('pem-stock').value) || 0,
              desc: document.getElementById('pem-desc').value.trim(),
              images: images,
              img: images[0],
              highlights: highlights,
              specs: {
                'Material': matSpec || 'Silk PLA (1.75mm)',
                'Dimensions': dimSpec || 'Standard Desk Size',
                'Print Technology': '100% FDM Farm Printed',
                'Country of Origin': 'India (D Loop 3D Farm)'
              },
              warranty: document.getElementById('pem-warranty').value.trim(),
              packageIncludes: `1x ${document.getElementById('pem-name').value.trim()}`
            };

            if (idx >= 0 && state.ready[idx]) {
              state.ready[idx] = prodObj;
            } else {
              state.ready.push(prodObj);
            }

            save(state);
            closeProductEditModal();
            refreshReadyTable();
            alert('✅ Product saved successfully!');
          };

          window.deleteReadyProduct = function(idx) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            state = load();
            state.ready.splice(idx, 1);
            save(state);
            refreshReadyTable();
          };

          refreshReadyTable();
          return;
        }

        // Custom Gifts basic renderer fallback
        root.innerHTML = `<h3 style="font-size:1rem;margin-bottom:12px">${title}</h3>
          <div class="form-row">
            <input id="p_name" placeholder="Product Name" style="flex:2">
            <input id="p_qty" placeholder="Quantity" type="number" style="flex:0.7">
            <input id="p_price" placeholder="Price ₹" type="number" style="flex:0.7">
            <button id="p_add" class="btn btn-success">+ Add</button>
          </div>
          <table><thead><tr><th>Name</th><th>Qty</th><th>Price</th><th>Actions</th></tr></thead><tbody id="p_list"></tbody></table>`;

        function refresh(){
          state = load();
          const tbody=document.getElementById('p_list'); tbody.innerHTML='';
          (state[key]||[]).forEach((it,idx)=>{
            const tr=document.createElement('tr');
            tr.innerHTML=`<td>${escapeHTML(it.name)}</td><td>${it.qty||0}</td><td>₹${it.price||0}</td><td><button data-idx="${idx}" data-act="p_del" class="btn btn-danger btn-sm">Delete</button></td>`;
            tbody.appendChild(tr);
          });
        }
        refresh();

        root.addEventListener('click', e=>{
          const b=e.target.closest('button'); if(!b) return;
          const act=b.getAttribute('data-act'); const idx=b.getAttribute('data-idx');
          if(act==='p_del'){
            state = load();
            state[key].splice(idx,1); save(state); refresh();
          }
        });

        document.getElementById('p_add').addEventListener('click', ()=>{
          state = load();
          const name=document.getElementById('p_name').value.trim();
          if(!name) return alert('Enter product name');
          const qty=Number(document.getElementById('p_qty').value)||0;
          const price=Number(document.getElementById('p_price').value)||0;
          if(!state[key]) state[key]=[];
          state[key].push({name,qty,price});
          save(state); refresh();
          document.getElementById('p_name').value='';
          document.getElementById('p_qty').value='';
          document.getElementById('p_price').value='';
        });
      }

      window.refreshAdminOrders = function() {
        const activeTab = document.querySelector('.tabs button.active')?.getAttribute('data-section');
        if (activeTab === 'orders') {
          renderOrders(document.getElementById('content'));
        }
      };

      window.downloadStlModel = function(orderId, fileName, customDataUrl) {
        let dataUrl = customDataUrl;
        let name = fileName || 'model.stl';

        if (!dataUrl && orderId) {
          const stock = load();
          const order = (stock.orders || []).find(o => o.orderId === orderId);
          if (order && order.items) {
            const match = order.items.find(it => 
              (it.fileName && it.fileName === fileName) || 
              (it.name && it.name.includes(fileName)) || 
              it.fileDataUrl
            );
            if (match && match.fileDataUrl) {
              dataUrl = match.fileDataUrl;
            }
          }
        }

        if (!dataUrl) {
          const safeName = name.replace(/[^a-zA-Z0-9]/g, '_');
          const stlAscii = `solid ${safeName}\nfacet normal 0 0 1\nouter loop\nvertex 0 0 0\nvertex 25 0 0\nvertex 0 25 0\nendloop\nendfacet\nfacet normal 0 0 1\nouter loop\nvertex 25 0 0\nvertex 25 25 0\nvertex 0 25 0\nendloop\nendfacet\nendsolid ${safeName}`;
          dataUrl = 'data:model/stl;charset=utf-8,' + encodeURIComponent(stlAscii);
        }

        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = name.endsWith('.stl') ? name : `${name}.stl`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 250);
      };

      document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>{
        renderSection(b.getAttribute('data-section'));
      }));

      // Live update admin orders when customer places order in another tab
      window.addEventListener('storage', (e) => {
        if (e.key === 'dl3d_stock_v1') {
          const activeTab = document.querySelector('.tabs button.active')?.getAttribute('data-section');
          if (activeTab === 'orders') {
            renderOrders(document.getElementById('content'));
          }
        }
      });

      renderSection('filaments');
    }

    (async ()=>{
      if(await ensureAuth()) startAdmin();
    })();
  </script>
</body>
