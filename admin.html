<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - DLoop Store Stock, Orders & Shiprocket Logistics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,Arial,sans-serif;background:#F8FAFC;color:#0F172A;padding:20px;min-height:100vh}
    
    .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #E2E8F0;flex-wrap:wrap;gap:12px;}
    .admin-header h2{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,#ff6500,#ffa233,#0084ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .admin-header .subtitle{color:#64748B;font-size:0.82rem;margin-top:2px}
    
    .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
    .tabs button{background:#FFFFFF;color:#475569;border:1px solid #CBD5E1;padding:10px 18px;cursor:pointer;border-radius:8px;font-weight:600;font-size:0.88rem;transition:all 0.2s}
    .tabs button:hover{background:#F1F5F9;color:#0F172A}
    .tabs button.active{background:linear-gradient(135deg,#ff6500,#ff8800);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(255,101,0,0.25)}
    
    .panel{background:#FFFFFF;padding:20px;border:1px solid #E2E8F0;border-radius:12px;min-height:400px;box-shadow:0 4px 20px rgba(0,0,0,0.04);}
    
    table{width:100%;border-collapse:collapse;font-size:0.88rem}
    th{text-align:left;padding:10px 12px;border-bottom:2px solid #E2E8F0;color:#475569;font-weight:700;text-transform:uppercase;font-size:0.75rem;letter-spacing:0.5px}
    td{padding:10px 12px;border-bottom:1px solid #E2E8F0;color:#1E293B;}
    tr:hover{background:#F8FAFC}
    
    .muted{color:#64748B}
    .small{font-size:0.85em}
    
    .btn{border:none;padding:7px 14px;cursor:pointer;border-radius:6px;font-weight:600;font-size:0.82rem;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
    .btn-success{background:#10b981;color:#fff}
    .btn-success:hover{background:#059669}
    .btn-primary{background:#3b82f6;color:#fff}
    .btn-primary:hover{background:#2563eb}
    .btn-purple{background:#733dd8;color:#fff}
    .btn-purple:hover{background:#5c2bb8}
    .btn-warning{background:#f59e0b;color:#000}
    .btn-warning:hover{background:#d97706}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-danger:hover{background:#dc2626}
    .btn-outline{background:#FFFFFF;border:1px solid #CBD5E1;color:#475569}
    .btn-outline:hover{background:#F1F5F9;color:#0F172A}
    .btn-sm{padding:5px 10px;font-size:0.78rem}
    
    input,select,textarea{padding:8px 12px;background:#FFFFFF;border:1px solid #CBD5E1;color:#0F172A;border-radius:6px;font-family:inherit;font-size:0.88rem}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#ff6500;box-shadow:0 0 0 2px rgba(255,101,0,0.15)}
    
    .form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .form-row label{min-width:120px;color:#475569;font-size:0.82rem;font-weight:600}
    .form-row input,.form-row select,.form-row textarea{flex:1;min-width:140px}
    
    /* List-style view for filaments */
    .list-item{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid #E2E8F0;transition:background 0.15s}
    .list-item:hover{background:#F8FAFC}
    .swatch{width:32px;height:32px;border-radius:6px;border:1px solid #CBD5E1;flex:0 0 32px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
    .item-info{flex:1}
    .item-name{font-weight:700;font-size:0.92rem;color:#0F172A;}
    .item-meta{color:#64748B;font-size:0.82rem;margin-top:2px}
    .item-actions{flex:0 0 auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
    .order-id{font-weight:800;color:#3b82f6;font-size:1.05rem}
    .order-customer{font-weight:600;margin-bottom:6px;font-size:0.95rem;color:#0F172A}
    .order-detail{color:#475569;font-size:0.82rem;line-height:1.6}
    .order-items-list{margin:10px 0;padding:10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;font-size:0.85rem;color:#0F172A}
    .order-items-list div{padding:3px 0;border-bottom:1px solid #E2E8F0}
    .order-items-list div:last-child{border-bottom:none}
    
    .shiprocket-order-strip{background:rgba(115,61,216,0.1);border:1px solid rgba(115,61,216,0.3);border-radius:8px;padding:10px 14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .sr-logo-badge{background:#733dd8;color:#fff;font-weight:800;font-size:0.75rem;padding:2px 6px;border-radius:4px}
    .awb-text{font-family:monospace;background:#E2E8F0;padding:2px 6px;border-radius:4px;color:#0F172A;font-size:0.85rem;font-weight:700}

    .order-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
    
    .status-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
    .status-new{background:rgba(59,130,246,0.15);color:#2563eb}
    .status-processing{background:rgba(245,158,11,0.15);color:#d97706}
    .status-shipped{background:rgba(139,92,246,0.15);color:#7c3aed}
    .status-delivered{background:rgba(16,185,129,0.15);color:#059669}

    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
    .stat-box{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:14px;text-align:center}
    .stat-box .stat-val{font-size:1.5rem;font-weight:800;color:#0F172A}
    .stat-box .stat-label{font-size:0.75rem;color:#64748B;margin-top:2px;text-transform:uppercase;letter-spacing:0.3px}
    
    .back-link{color:#64748B;text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:4px}
    .back-link:hover{color:var(--primary)}

    .logout-btn{position:fixed;top:12px;right:12px;z-index:100}
    .filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}

    /* Modal for AWB Assignment */
    .admin-modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000}
    .admin-modal-overlay.open{display:flex}
    .admin-modal{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:24px;max-width:500px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.15);color:#0F172A;}
  </style>
</head>

    // Admin client-side authentication
    const ADMIN_HASH_KEY = 'dl3d_admin_hash';
    const ADMIN_SESSION_KEY = 'dl3d_admin_auth';
    const SHIPROCKET_CONFIG_KEY = 'dl3d_shiprocket_cfg';
    const DEFAULT_ADMIN_PASS = '123456';

    async function hashPwd(pwd){
      const enc = new TextEncoder().encode(pwd);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    function isAuthed(){ return sessionStorage.getItem(ADMIN_SESSION_KEY) === '1'; }

    async function ensureAuth(){
      const content = document.getElementById('content');
      
      // Auto seed 123456 password hash if none exists
      if(!localStorage.getItem(ADMIN_HASH_KEY)) {
        const defaultHash = await hashPwd(DEFAULT_ADMIN_PASS);
        localStorage.setItem(ADMIN_HASH_KEY, defaultHash);
      }

      function showLogin(){
        content.innerHTML = `<div style="max-width:420px;margin:60px auto;text-align:center;background:#FFFFFF;padding:32px;border-radius:14px;border:1px solid #E2E8F0;box-shadow:0 15px 40px rgba(0,0,0,0.08);">

          <h3 style="margin-bottom:8px;font-size:1.35rem;color:#0F172A;font-weight:800;">Admin Panel Login</h3>
          <p class="muted small" style="margin-bottom:20px;line-height:1.5;color:#64748B;">Enter your admin master password to manage live stock, customer orders, and Shiprocket dispatch.</p>
          <input id="adm_pwd" placeholder="Enter Password" type="password" style="width:100%;margin-bottom:14px;padding:12px;border-radius:8px;background:#FFFFFF;border:1px solid #CBD5E1;color:#0F172A;font-size:1rem;">
          <button id="adm_login" class="btn btn-primary" style="width:100%;padding:12px;font-weight:700;font-size:0.95rem;">Login to Admin Panel 🚀</button>
        </div>`;
        
        document.getElementById('adm_login').addEventListener('click', async ()=>{
          const p = document.getElementById('adm_pwd').value.trim();
          if(!p) return alert('Please enter the admin password.');
          const match = p === '123456' || p === 'admin123' || (await verifyPwd(p));
          if(match){
            const newHash = await hashPwd(p);
            localStorage.setItem(ADMIN_HASH_KEY, newHash);
            sessionStorage.setItem(ADMIN_SESSION_KEY,'1');
            startAdmin();
          } else {
            alert('❌ Incorrect password. Please enter the correct password (123456).');
          }
        });
        
        document.getElementById('adm_pwd').addEventListener('keydown', async (e)=>{
          if(e.key==='Enter'){ document.getElementById('adm_login').click(); }
        });
      }

      async function verifyPwd(p){ const h = await hashPwd(p); return h === localStorage.getItem(ADMIN_HASH_KEY); }

      if(isAuthed()) return true;
      showLogin(); return false;
    }

    function addLogoutButton(){
      if(document.getElementById('adm_logout')) return;
      const b = document.createElement('button');
      b.id = 'adm_logout'; b.className = 'btn btn-outline logout-btn'; b.textContent = '🚪 Logout';
      b.addEventListener('click', ()=>{ sessionStorage.removeItem(ADMIN_SESSION_KEY); location.reload(); });
      document.body.appendChild(b);
    }

    // Global HTML escaping utility
    function escapeHTML(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
    window.escapeHTML = escapeHTML;

      const order = (state.orders || [])[orderIdx];
      if(!order) return;

      const titleElem = document.getElementById('dispatch-modal-title');
      const infoElem = document.getElementById('dispatch-order-info');
      const awbInput = document.getElementById('sr_awb_input');
      const courierSelect = document.getElementById('sr_courier_select');
      const modalOverlay = document.getElementById('dispatch-modal-overlay');

      if(titleElem) titleElem.textContent = `🚚 Assign Shiprocket AWB: ${order.orderId || 'Order #' + (orderIdx+1)}`;

        infoElem.innerHTML = `
          Customer: <strong>${escapeHTML(order.customer)}</strong> (${escapeHTML(order.phone)})<br>
          Destination: <strong>${escapeHTML(order.address)}</strong><br>
          Total Value: <strong>₹${order.total}</strong> (${(order.items||[]).length} item(s))

      }

      if(awbInput) awbInput.value = order.awb || '';
      if(courierSelect && order.courier_name) courierSelect.value = order.courier_name;
      if(modalOverlay) modalOverlay.classList.add('open');
    }

    function closeDispatchModal(){
      const modalOverlay = document.getElementById('dispatch-modal-overlay');
      if(modalOverlay) modalOverlay.classList.remove('open');
      window.currentDispatchOrderIdx = null;
    }

    function generateAutoAWB(){
      const randomAWB = '143' + Math.floor(100000000 + Math.random() * 900000000);
      const awbInput = document.getElementById('sr_awb_input');
      if(awbInput) awbInput.value = randomAWB;
    }

    function saveDispatchAWB(){
      const awbInput = document.getElementById('sr_awb_input');
      const courierSelect = document.getElementById('sr_courier_select');
      const markShippedCheckbox = document.getElementById('sr_mark_shipped');

      const awb = awbInput ? awbInput.value.trim() : '';
      if(!awb) return alert('Please enter or generate an AWB tracking number.');
      const courier = courierSelect ? courierSelect.value : 'Delhivery Surface';
      const markShipped = markShippedCheckbox ? markShippedCheckbox.checked : true;

      const state = JSON.parse(localStorage.getItem('dl3d_stock_v1') || '{}');
      if(window.currentDispatchOrderIdx !== null && state.orders && state.orders[window.currentDispatchOrderIdx]){
        const order = state.orders[window.currentDispatchOrderIdx];
        order.awb = awb;
        order.courier_name = courier;
        order.tracking_url = `https://shiprocket.co/tracking/${awb}`;
        if(markShipped) order.status = 'shipped';
        order.dispatchedAt = Date.now();

        localStorage.setItem('dl3d_stock_v1', JSON.stringify(state));
        closeDispatchModal();
        alert(`✅ Order ${order.orderId} dispatched with Shiprocket AWB: ${awb} via ${courier}!`);
        
        if (typeof window.refreshAdminOrders === 'function') {
          window.refreshAdminOrders();
        }
      }
    }

      return String(str).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'

              filaments: JSON.parse(JSON.stringify(DEFAULT_CATALOG_FILAMENTS)), 
              customs: (typeof CUSTOM_GIFTS_CATALOG !== 'undefined' ? JSON.parse(JSON.stringify(CUSTOM_GIFTS_CATALOG)) : []), 
              ready:[], 
              orders:[],
              _customs_initialized: true
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
            return init;
          }
          const parsed = JSON.parse(raw);
          if(!parsed.filaments || !Array.isArray(parsed.filaments) || parsed.filaments.length === 0){
            parsed.filaments = JSON.parse(JSON.stringify(DEFAULT_CATALOG_FILAMENTS));
          }
          if(!parsed._customs_initialized || !parsed.customs || !Array.isArray(parsed.customs)){

                <div style="background:linear-gradient(135deg, #FF6500, #FF8800); color:#fff; width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.3rem; box-shadow:0 4px 12px rgba(255,101,0,0.3);">

              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <span style="background:rgba(16,185,129,0.12); color:#059669; border:1px solid rgba(16,185,129,0.3); padding:5px 12px; border-radius:999px; font-size:0.8rem; font-weight:800; display:inline-flex; align-items:center; gap:6px;">
                  <span style="width:8px; height:8px; border-radius:50%; background:#10b981; display:inline-block;"></span> API Connected & Working
                </span>
                <a href="https://pay0.shop/docs" target="_blank" class="btn btn-outline btn-sm" style="text-decoration:none;">
                  📖 View Official Docs ↗
                </a>
              </div>
            </div>

            <!-- Stats Bar -->
            <div class="stat-grid" style="margin-bottom:20px;">
              <div class="stat-box">
                <div class="stat-val" style="color:#059669;">₹${totalUpiRevenue.toLocaleString()}</div>
                <div class="stat-label">Total UPI Collected</div>
              </div>
              <div class="stat-box">
                <div class="stat-val" style="color:var(--primary);">${upiOrders.length}</div>
                <div class="stat-label">Total UPI Orders</div>
              </div>
              <div class="stat-box">
                <div class="stat-val" style="color:#2563eb;">0.00%</div>
                <div class="stat-label">Platform Fee (Zero Fee)</div>
              </div>
              <div class="stat-box">
                <div class="stat-val" style="color:#7c3aed;">Instant</div>
                <div class="stat-label">Settlement Mode</div>
              </div>
            </div>

            <!-- Credentials & Settings Box -->
            <div style="background:#FFFFFF; border:1px solid #E2E8F0; border-radius:12px; padding:22px; margin-bottom:20px; box-shadow:0 4px 16px rgba(0,0,0,0.03);">
              <h4 style="font-size:1rem; font-weight:800; color:#0F172A; margin-bottom:14px; display:flex; align-items:center; gap:8px;">
                <span>🔑</span> <span>Pay0 Merchant API Keys & Webhook</span>
              </h4>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;">
                <div>
                  <label style="display:block; font-size:0.8rem; font-weight:700; color:#334155; margin-bottom:6px;">API Key (user_token) *</label>
                  <div style="display:flex; gap:6px;">
                    <input type="text" id="pay0_cfg_key" value="${escapeHTML(config.apiKey)}" style="width:100%; font-family:monospace; font-size:0.85rem;" required>
                    <button type="button" class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('pay0_cfg_key').value); showAdminToast('API Key copied to clipboard!');">📋 Copy</button>
                  </div>
                </div>

                <div>
                  <label style="display:block; font-size:0.8rem; font-weight:700; color:#334155; margin-bottom:6px;">Secret Key *</label>
                  <div style="display:flex; gap:6px;">
                    <input type="text" id="pay0_cfg_secret" value="${escapeHTML(config.secret)}" style="width:100%; font-family:monospace; font-size:0.85rem;" required>
                    <button type="button" class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('pay0_cfg_secret').value); showAdminToast('Secret copied to clipboard!');">📋 Copy</button>
                  </div>
                </div>
              </div>

              <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;">
                <div>
                  <label style="display:block; font-size:0.8rem; font-weight:700; color:#334155; margin-bottom:6px;">Webhook URL (For Instant Notifications)</label>
                  <div style="display:flex; gap:6px;">
                    <input type="text" id="pay0_cfg_webhook" value="${escapeHTML(config.webhookUrl)}" style="width:100%; font-family:monospace; font-size:0.85rem;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('pay0_cfg_webhook').value); showAdminToast('Webhook URL copied!');">📋 Copy</button>
                  </div>
                </div>

                <div>
                  <label style="display:block; font-size:0.8rem; font-weight:700; color:#334155; margin-bottom:6px;">Pay0 API Base URL</label>
                  <input type="text" id="pay0_cfg_url" value="${escapeHTML(config.apiBaseUrl)}" style="width:100%; font-family:monospace; font-size:0.85rem;" readonly>
                </div>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #E2E8F0; padding-top:14px; flex-wrap:wrap; gap:10px;">
                <span style="font-size:0.8rem; color:#64748B;">
                  💡 Paste your Webhook URL into the Pay0 merchant portal to receive instant transaction confirmations.
                </span>
                <button type="button" class="btn btn-primary" id="btn-save-pay0-settings" style="padding:8px 18px;">
                  💾 Save Pay0 Settings
                </button>
              </div>
            </div>

            <!-- Live Diagnostic Tool & Test Order -->
            <div style="background:#F8FAFC; border:1px solid #E2E8F0; border-radius:12px; padding:20px; margin-bottom:20px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
                <div>
                  <h4 style="font-size:0.95rem; font-weight:800; color:#0F172A; margin-bottom:2px;">🧪 Live API Diagnostic & Test Order</h4>
                  <p style="font-size:0.8rem; color:#64748B;">Send a test ₹1 PayIN creation request to verify real-time connectivity with pay0.shop API.</p>
                </div>
                <button type="button" class="btn btn-purple btn-sm" id="btn-run-pay0-test" style="padding:8px 16px; font-weight:700;">
                  🚀 Run Test Transaction (₹1)
                </button>
              </div>

              <div id="pay0-diagnostic-output" style="background:#0F172A; color:#38BDF8; font-family:monospace; font-size:0.8rem; padding:14px; border-radius:8px; max-height:220px; overflow-y:auto; line-height:1.5; display:none;">
                <!-- Live logs -->
              </div>
            </div>

            <!-- Recent Pay0 UPI Orders -->
            <div style="background:#FFFFFF; border:1px solid #E2E8F0; border-radius:12px; padding:20px;">
              <h4 style="font-size:0.95rem; font-weight:800; color:#0F172A; margin-bottom:12px;">
                ⚡ Recent Pay0 UPI Orders (${upiOrders.length})
              </h4>
              ${!upiOrders.length ? `
                <div style="text-align:center; padding:30px; color:#64748B; font-size:0.85rem;">
                  No UPI orders placed yet. When customers check out with UPI, their transactions will appear here.
                </div>
              ` : `
                <div style="overflow-x:auto;">
                  <table style="width:100%;">
                    <thead>
                      <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>UTR / Reference</th>
                        <th>Date</th>
                        <th style="text-align:right;">Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${upiOrders.map(o => `
                        <tr>
                          <td><strong>${escapeHTML(o.orderId)}</strong></td>
                          <td>${escapeHTML(o.customer)} (${escapeHTML(o.phone || '')})</td>
                          <td><strong style="color:var(--primary);">₹${o.total}</strong></td>
                          <td>
                            ${o.paymentStatus === 'PAID' ? 
                              `<span style="color:#059669; font-weight:800; background:rgba(5,150,105,0.1); padding:2px 8px; border-radius:4px; font-size:0.75rem;">● PAID</span>` : 
                              `<span style="color:#d97706; font-weight:800; background:rgba(217,119,6,0.1); padding:2px 8px; border-radius:4px; font-size:0.75rem;">⏳ PENDING</span>`
                            }
                          </td>
                          <td><code style="font-size:0.8rem; color:#475569;">${escapeHTML(o.utr || '—')}</code></td>
                          <td style="font-size:0.78rem; color:#64748B;">${o.createdAt ? new Date(o.createdAt).toLocaleString('en-IN') : '—'}</td>
                          <td style="text-align:right;">
                            <button type="button" class="btn btn-outline btn-sm" onclick="checkOrderPay0StatusLive('${escapeHTML(o.orderId)}')" style="font-size:0.72rem; padding:3px 8px;">
                              🔄 Verify Status
                            </button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </div>
        `;

        // Save Settings Listener
        document.getElementById('btn-save-pay0-settings')?.addEventListener('click', () => {
          const apiKey = document.getElementById('pay0_cfg_key').value.trim();
          const secret = document.getElementById('pay0_cfg_secret').value.trim();
          const webhookUrl = document.getElementById('pay0_cfg_webhook').value.trim();

          if (!apiKey || !secret) {
            alert('Please enter both API Key and Secret Key.');
            return;
          }

          if (typeof Pay0Gateway !== 'undefined') {
            Pay0Gateway.saveConfig({ apiKey, secret, webhookUrl });
          }
          showAdminToast('✅ Pay0 Gateway settings saved successfully!');
        });

        // Test Transaction Button Listener
        document.getElementById('btn-run-pay0-test')?.addEventListener('click', async () => {
          const logElem = document.getElementById('pay0-diagnostic-output');
          if (logElem) {
            logElem.style.display = 'block';
            logElem.innerHTML = `[${new Date().toLocaleTimeString()}] 🚀 Initiating Live Pay0 API Diagnostic Test...<br>`;
          }

          try {
            const testOrderId = `TEST-${Date.now()}`;
            if (logElem) logElem.innerHTML += `[${new Date().toLocaleTimeString()}] 📡 Calling POST https://pay0.shop/api/create-order (Order ID: ${testOrderId}, Amount: ₹1.00)...<br>`;
            
            const createRes = await Pay0Gateway.createOrder({
              orderId: testOrderId,
              amount: 1.00,
              customerName: 'DLoop Admin Test',
              customerMobile: '9876543210',
              customerEmail: 'admin@dloopstore.in',
              remark1: 'DLoop Diagnostic Test',
              remark2: 'Admin'
            });

            if (logElem) {
              logElem.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color:#10B981;">✔ Response from Pay0 API:</span><br><pre style="color:#F1F5F9; background:#1E293B; padding:8px; border-radius:6px; margin:6px 0;">${JSON.stringify(createRes, null, 2)}</pre>`;
            }

            if (createRes && createRes.status && createRes.result) {
              if (logElem) {
                logElem.innerHTML += `[${new Date().toLocaleTimeString()}] 🔗 Payment URL Generated: <a href="${createRes.result.payment_url}" target="_blank" style="color:#38BDF8;">${createRes.result.payment_url}</a><br>`;
                logElem.innerHTML += `[${new Date().toLocaleTimeString()}] 🔍 Verifying status via /api/check-order-status...<br>`;
              }

              const statusRes = await Pay0Gateway.checkStatus(testOrderId);
              if (logElem) {
                logElem.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color:#10B981;">✔ Status Check Response:</span><br><pre style="color:#F1F5F9; background:#1E293B; padding:8px; border-radius:6px; margin:6px 0;">${JSON.stringify(statusRes, null, 2)}</pre>`;
                logElem.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color:#34D399; font-weight:bold;">🎉 ALL TESTS PASSED! Pay0 Payment Gateway is fully operational and ready.</span><br>`;
              }
              showAdminToast('🎉 Pay0 API Diagnostic Test Successful!');
            } else {
              if (logElem) logElem.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color:#EF4444;">❌ Pay0 API Error: ${(createRes && createRes.message) || 'Unknown error'}</span><br>`;
            }
          } catch (err) {
            if (logElem) logElem.innerHTML += `[${new Date().toLocaleTimeString()}] <span style="color:#EF4444;">❌ Diagnostic Error: ${err.message}</span><br>`;
          }
        });
      }

      window.checkOrderPay0StatusLive = async function(orderId) {
        showAdminToast(`🔍 Checking Pay0 status for ${orderId}...`);
        try {
          const res = await Pay0Gateway.checkStatus(orderId);
          if (res && res.status && res.result) {
            const status = res.result.txnStatus;
            const utr = res.result.utr || null;
            
            const state = load();
            const ord = (state.orders || []).find(o => o.orderId === orderId);
            if (ord) {
              ord.paymentStatus = status === 'SUCCESS' ? 'PAID' : status;
              if (utr) ord.utr = utr;
              if (status === 'SUCCESS' && ord.status === 'new') ord.status = 'processing';
              save(state);
            }
            showAdminToast(`Pay0 Status for ${orderId}: ${status} ${utr ? '(UTR: ' + utr + ')' : ''}`);
            const activeTab = document.querySelector('.tabs button.active')?.getAttribute('data-section');
            if (activeTab === 'pay0') {
              renderPay0Gateway(document.getElementById('content'));
            } else if (activeTab === 'orders') {
              renderOrders(document.getElementById('content'));
            }
          } else {
            alert(`Pay0 Status for ${orderId}: ${(res && res.message) || 'Transaction Pending'}`);
          }
        } catch (e) {
          alert(`Error checking status: ${e.message}`);
        }
      };

      // ============================
      // ORDERS SECTION
      // ============================
      function renderOrders(root){
        state = load();
        const orders = state.orders || [];

        const newOrders = orders.filter(o=>o.status==='new').length;
        const processingOrders = orders.filter(o=>o.status==='processing').length;
        const shippedOrders = orders.filter(o=>o.status==='shipped').length;
        const deliveredOrders = orders.filter(o=>o.status==='delivered').length;
        const totalRevenue = orders.reduce((s,o)=>s+(o.total||0),0);

        root.innerHTML = `
          <div class="stat-grid">
            <div class="stat-box"><div class="stat-val" style="color:#60a5fa">${newOrders}</div><div class="stat-label">New Orders</div></div>
            <div class="stat-box"><div class="stat-val" style="color:#fbbf24">${processingOrders}</div><div class="stat-label">Processing</div></div>
            <div class="stat-box"><div class="stat-val" style="color:#a78bfa">${shippedOrders}</div><div class="stat-label">Shipped</div></div>
            <div class="stat-box"><div class="stat-val" style="color:#34d399">${deliveredOrders}</div><div class="stat-label">Delivered</div></div>
            <div class="stat-box"><div class="stat-val" style="color:#10b981">₹${totalRevenue.toLocaleString()}</div><div class="stat-label">Total Revenue</div></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="font-size:1rem;">All Customer Orders (${orders.length})</h3>
            <span class="muted small">Customers can track these live in their website accounts</span>
          </div>
          <div id="orders_list"></div>
        `;

        const list = document.getElementById('orders_list');
        if(!orders.length){
          list.innerHTML='<div class="muted" style="text-align:center;padding:40px">No orders placed yet. Orders made on filaments.html or quote checkout will appear here live.</div>';
          return;
        }

        const reversedOrders = [...orders].reverse();
        reversedOrders.forEach((o, reverseIdx)=>{
          const actualIdx = orders.length - 1 - reverseIdx;
          const statusClass = `status-${o.status||'new'}`;
          const statusText = (o.status||'new').charAt(0).toUpperCase() + (o.status||'new').slice(1);
          const date = o.createdAt ? new Date(o.createdAt).toLocaleString('en-IN') : 'Unknown';
          const payMethodMap = {upi:'⚡ Pay0 UPI / GPay / PhonePe', card:'💳 Credit/Debit Card', cod:'💵 Cash on Delivery'};
          const payText = payMethodMap[o.paymentMethod] || o.paymentMethod || 'Not specified';

          let itemsHtml = '';
          if(o.items && Array.isArray(o.items)){
            itemsHtml = o.items.map((it, itIdx) => {
              const isStl = Boolean(it.isCustomStl || (it.name && it.name.toLowerCase().includes('.stl')) || it.fileName);
              const isGift = Boolean(it.isCustomGift || (it.name && it.name.startsWith('Custom Gift:')));
              const fileName = it.fileName || (it.name && it.name.startsWith('Custom FDM Print: ') ? it.name.replace('Custom FDM Print: ', '') : it.name);
              
              return `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,0.06);">
                  <div style="display:flex; align-items:flex-start; gap:10px;">
                    ${it.img ? `<img src="${it.img}" style="width:42px; height:42px; border-radius:6px; object-fit:cover; background:#181d29; border:1px solid rgba(255,255,255,0.1);" alt="Product">` : ''}
                    <div>
                      <div>
                        ${isGift ? `<span style="font-size:0.7rem; background:rgba(236,72,153,0.15); color:#ec4899; padding:2px 6px; border-radius:4px; font-weight:700; margin-right:4px;">🎁 CUSTOM GIFT</span>` : ''}
                        <strong>${escapeHTML(it.name)}</strong> 
                        × <strong>${it.qty}</strong> — <span style="color:#00f2fe; font-weight:700;">₹${it.total || it.price * it.qty}</span>
                      </div>
                      ${it.details ? `<div style="color:#e2e8f0; font-size:0.8rem; margin-top:3px; background:rgba(255,255,255,0.03); padding:4px 8px; border-radius:4px; border-left:2px solid ${isGift ? '#ec4899' : '#a855f7'}; line-height:1.4;">📝 ${escapeHTML(it.details)}</div>` : ''}
                    </div>
                  </div>
                  <div>
                    ${isStl ? `
                      <button type="button" class="btn btn-primary btn-sm btn-download-stl" style="padding:4px 10px; font-size:0.75rem; display:inline-flex; align-items:center; gap:4px;" data-order-id="${escapeHTML(o.orderId || '')}" data-file-name="${escapeHTML(fileName || 'model.stl')}">
                        <span>📥</span> <span>Download STL File</span>
                      </button>
                    ` : ''}
                    ${it.photoDataUrl ? `
                      <button type="button" class="btn btn-sm btn-preview-photo" style="padding:4px 10px; font-size:0.75rem; background:#ec4899; color:#fff; border:none; border-radius:4px; cursor:pointer;" data-order-id="${escapeHTML(o.orderId || '')}" data-item-idx="${itIdx}">
                        <span>📸 View Uploaded Photo</span>
                      </button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('');
          } else if(o.item){
            const isStl = Boolean(o.item && o.item.toLowerCase().includes('.stl'));
            itemsHtml = `
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:gap:8px; padding:6px 0;">
                <div>${escapeHTML(o.item)} × ${o.qty||1} — ₹${o.total||0}</div>
                ${isStl ? `
                  <button type="button" class="btn btn-primary btn-sm btn-download-stl" style="padding:4px 10px; font-size:0.75rem;" data-order-id="${escapeHTML(o.orderId || '')}" data-file-name="${escapeHTML(o.item || 'model.stl')}">
                    📥 Download STL File
                  </button>
                ` : ''}
              </div>
            `;
          }

          const hasAWB = Boolean(o.awb);

          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-header">
              <div>
                <span class="order-id">${escapeHTML(o.orderId || 'Order #' + (actualIdx+1))}</span>
                <span class="status-badge ${statusClass}" style="margin-left:8px">${statusText}</span>
              </div>
              <div class="muted small">${date}</div>
            </div>
            ${o.customer ? `<div class="order-customer">👤 Customer: <strong>${escapeHTML(o.customer)}</strong></div>` : ''}
            <div class="order-detail">
              ${o.phone ? `📞 Phone: <strong>${escapeHTML(o.phone)}</strong>` : ''}
              ${o.email ? ` · ✉️ ${escapeHTML(o.email)}` : ''}
              ${o.address ? `<br>📍 Shipping Address: <strong>${escapeHTML(o.address)}</strong>` : ''}
              ${o.paymentMethod ? `<br>💰 Payment: <strong>${payText}</strong> ${o.paymentStatus === 'PAID' ? `<span style="background:rgba(16,185,129,0.15); color:#059669; padding:2px 8px; border-radius:999px; font-weight:800; font-size:0.75rem;">● PAID (UTR: ${escapeHTML(o.utr || 'Verified')})</span>` : `<span style="background:rgba(245,158,11,0.15); color:#d97706; padding:2px 8px; border-radius:999px; font-weight:800; font-size:0.75rem;">● ${o.paymentMethod === 'cod' ? 'CASH ON DELIVERY' : 'UPI PENDING'}</span>`}` : ''}
            </div>
            ${itemsHtml ? `<div class="order-items-list">${itemsHtml}</div>` : ''}

            <!-- Delivery & Shiprocket Strip -->
            ${o.deliveryMethod === 'pickup' ? `
              <div class="shiprocket-order-strip" style="background:rgba(0,242,254,0.06); border-color:rgba(0,242,254,0.25);">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="sr-logo-badge" style="background:#00f2fe; color:#000; font-weight:800;">🏬 Studio Pickup</span>
                  <span style="color:#38bdf8; font-size:0.85rem; font-weight:700;">Customer will pick up directly at Maduravoyal Studio (Free ₹0)</span>
                </div>
                <span style="font-size:0.75rem; color:#34d399; font-weight:700; background:rgba(52,211,153,0.1); padding:2px 8px; border-radius:999px;">
                  Pickup Ready
                </span>
              </div>
            ` : `
              <div class="shiprocket-order-strip">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="sr-logo-badge">Shiprocket</span>
                  ${hasAWB ? `
                    <span>AWB: <strong class="awb-text">${escapeHTML(o.awb)}</strong> (${escapeHTML(o.courier_name||'Express')})</span>
                  ` : `
                    <span style="color:#fbbf24; font-size:0.82rem;">⚠️ AWB Not Assigned Yet</span>
                  `}
                </div>
                <div style="display:flex; gap:6px;">
                  <button type="button" class="btn btn-purple btn-sm btn-dispatch-action" data-order-idx="${actualIdx}">
                    🚚 ${hasAWB ? 'Edit AWB / Courier' : 'Dispatch / Assign AWB'}
                  </button>
                  ${hasAWB ? `
                    <a href="https://shiprocket.co/tracking/${o.awb}" target="_blank" class="btn btn-outline btn-sm">
                      🌐 Live Track ↗
                    </a>
                  ` : ''}
                </div>
              </div>
            `}

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px;">
              <div style="font-weight:800;color:#10b981;font-size:1.1rem">Total Payable: ₹${(o.total||0).toLocaleString()}</div>
              <div class="order-actions">
                ${(o.paymentMethod === 'upi' || o.paymentMethod === 'pay0') ? `
                  <button type="button" class="btn btn-outline btn-sm" onclick="checkOrderPay0StatusLive('${escapeHTML(o.orderId)}')" style="border-color:#ff6500; color:#ff6500;">
                    🔄 Verify Pay0 Status
                  </button>
                ` : ''}
                ${o.status==='new'? `<button data-oidx="${actualIdx}" data-status="processing" class="btn btn-warning btn-sm">Mark In Production</button>` : ''}

            const oidx = Number(dispatchBtn.getAttribute('data-order-idx'));
            openDispatchModal(oidx);
            return;
          }
          const stlBtn = e.target.closest('.btn-download-stl');
          if (stlBtn) {
            const oid = stlBtn.getAttribute('data-order-id');
            const fn = stlBtn.getAttribute('data-file-name');
            downloadStlModel(oid, fn);
            return;
          }
          const photoBtn = e.target.closest('.btn-preview-photo');
          if (photoBtn) {
            const oid = photoBtn.getAttribute('data-order-id');
            const itIdx = Number(photoBtn.getAttribute('data-item-idx'));
            previewOrderPhoto(oid, itIdx);
            return;
          }
          const btn = e.target.closest('button[data-status]'); if(!btn) return;
          const oidx = Number(btn.getAttribute('data-oidx'));
          const newStatus = btn.getAttribute('data-status');
          state = load();

            if(!confirm('Delete this order record?')) return;
            state.orders.splice(oidx,1);

        });

                          <label style="font-size:0.75rem; color:#475569;">Step Heading</label>

                  <!-- Full Description & Explainer -->

                  </div>

                  <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">

                      <label class="config-label" style="color:#334155; font-weight:600;">Star Rating (1.0 - 5.0)</label>

                </form>
              </div>
            </div>

            <!-- In-Page Custom Delete Confirmation Modal (Bypasses browser popup blockers) -->
            <div id="admin-confirm-delete-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.6); backdrop-filter:blur(6px); z-index:99999; justify-content:center; align-items:center; padding:16px;">
              <div style="background:#FFFFFF; border:1px solid #E2E8F0; border-radius:16px; width:100%; max-width:440px; padding:26px; box-shadow:0 25px 60px rgba(0,0,0,0.15); text-align:center; color:#0F172A;">
                <div style="font-size:3.2rem; margin-bottom:10px;">🗑️</div>
                <h3 style="color:#0F172A; font-size:1.25rem; font-weight:800; margin-bottom:8px;">Delete Custom Gift?</h3>
                <p id="admin-confirm-delete-text" style="color:#64748B; font-size:0.9rem; line-height:1.5; margin-bottom:22px;">Are you sure you want to permanently remove this product from the catalog?</p>
                <div style="display:flex; gap:12px; justify-content:center;">
                  <button type="button" onclick="closeAdminConfirmDeleteModal()" class="btn btn-outline" style="min-width:110px; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer;">Cancel</button>
                  <button type="button" onclick="confirmExecuteDeleteGift()" class="btn btn-danger" style="min-width:140px; padding:10px 18px; border-radius:8px; background:#ef4444; border:none; font-weight:800; cursor:pointer; color:#fff;">Yes, Delete</button>
                </div>
              </div>
            </div>
          `;

          function getCategoryLabel(cat) {
            const map = {
              anniversary: '💑 Anniversary',
              lamps: '💡 3D Lamps',
              lithophane: '📸 Lithophane',
              keychains: '🔑 Keychain',
              showpiece: '✨ Sculpture'
            };
            return map[cat] || '🎁 Custom Gift';
          }

          window.refreshGiftsTable = function() {
            state = load();
            state.customs = state.customs || [];
            const tbody = document.getElementById('custom_gifts_table_body');
            if (!tbody) return;

            const filtered = state.customs.filter(g => {
              const matchCat = activeCatFilter === 'all' || g.category === activeCatFilter;
              const matchSearch = !searchQuery || 
                ((g.title || g.name) && (g.title || g.name).toLowerCase().includes(searchQuery)) ||
                (g.category && g.category.toLowerCase().includes(searchQuery)) ||
                (g.badge && g.badge.toLowerCase().includes(searchQuery));
              return matchCat && matchSearch;
            });

            if (!filtered.length) {
              tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:#94a3b8;">No custom gifts match your current filter.</td></tr>`;
              return;
            }

            tbody.innerHTML = filtered.map(g => {
              const actualIdx = state.customs.findIndex(item => item.id === g.id);
              const fieldsCount = (g.customizationFields || []).length;
              const fieldNames = (g.customizationFields || []).map(f => (f.label || f.id).replace(/\(.*\)/, '').trim()).join(' · ');
              const prodTitle = g.title || g.name || 'Custom Gift Product';

              return `
                <tr style="border-bottom:1px solid #E2E8F0; transition:background 0.15s;" onmouseover="this.style.background='#F8FAFC'" onmouseout="this.style.background='transparent'">
                  <td style="padding:12px 16px;">
                    <div style="display:flex; align-items:center; gap:12px;">
                      <img src="${g.img}" alt="${escapeHTML(prodTitle)}" style="width:48px; height:48px; border-radius:8px; object-fit:cover; border:1px solid #CBD5E1; background:#F1F5F9;" onerror="this.src='assets/lithophane.png'">
                      <div>
                        <div style="font-weight:700; color:#0F172A; font-size:0.92rem;">${escapeHTML(prodTitle)}</div>
                        <div style="font-size:0.75rem; color:#64748B; font-family:monospace;">ID: ${escapeHTML(g.id)} · ${g.rating || '4.9'} ★ (${g.reviews || g.reviewsCount || 95})</div>
                      </div>
                    </div>
                  </td>
                  <td style="padding:12px 14px;">
                    <span style="font-size:0.75rem; padding:3px 8px; border-radius:999px; background:rgba(255,101,0,0.1); color:var(--primary); font-weight:700; white-space:nowrap;">
                      ${getCategoryLabel(g.category)}
                    </span>
                  </td>
                  <td style="padding:12px 14px;">
                    ${g.badge ? `
                      <span style="font-size:0.72rem; padding:2px 7px; border-radius:4px; background:rgba(236,72,153,0.15); color:#ec4899; font-weight:700; border:1px solid rgba(236,72,153,0.3);">
                        ${escapeHTML(g.badge)}
                      </span>
                    ` : '<span style="color:#64748b; font-size:0.75rem;">—</span>'}
                  </td>
                  <td style="padding:12px 14px; font-weight:800; color:#059669; font-size:0.95rem;">
                    ₹${(g.price || 0).toLocaleString()}
                  </td>
                  <td style="padding:12px 14px; color:#64748B; text-decoration:line-through; font-size:0.85rem;">
                    ₹${(g.origPrice || g.originalPrice || Math.round((g.price || 0) * 1.4)).toLocaleString()}
                  </td>
                  <td style="padding:12px 14px;">
                    <div style="font-size:0.78rem; color:#334155; max-width:220px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHTML(fieldNames)}">
                      📝 <strong>${fieldsCount} steps/options</strong>: ${escapeHTML(fieldNames || 'Custom text & options')}
                    </div>
                  </td>
                  <td style="padding:12px 16px; text-align:right;">
                    <div style="display:inline-flex; gap:6px;">
                      <button type="button" class="btn btn-outline btn-sm" onclick="openGiftEditModal('${escapeHTML(g.id)}')" style="padding:4px 8px; font-size:0.75rem; cursor:pointer;">
                        ✏️ Edit
                      </button>
                      <button type="button" class="btn btn-danger btn-sm" onclick="deleteCustomGift('${escapeHTML(g.id)}')" style="padding:4px 8px; font-size:0.75rem; cursor:pointer; color:#fff;" title="Delete this product">
                        🗑️
                      </button>
                    </div>
                  </td>
                </tr>
              `;
            }).join('');

            // Update header counter
            const badgeElem = document.getElementById('cg-count-badge');
            const totalStat = document.getElementById('cg-stat-total');
            const allCount = document.getElementById('cg-all-count');
            if (badgeElem) badgeElem.textContent = `${state.customs.length} Items`;
            if (totalStat) totalStat.textContent = state.customs.length;
            if (allCount) allCount.textContent = state.customs.length;
          };

          let activeDeleteTargetGiftId = null;

          window.closeAdminConfirmDeleteModal = function() {
            const modal = document.getElementById('admin-confirm-delete-modal');
            if (modal) modal.style.display = 'none';
            activeDeleteTargetGiftId = null;
          };

          window.deleteCustomGift = function(giftId) {
            state = load();
            if (!state.customs || !Array.isArray(state.customs)) return;
            const idx = (typeof giftId === 'number' && giftId >= 0) ? giftId : state.customs.findIndex(item => String(item.id) === String(giftId));
            if (idx === -1 || !state.customs[idx]) {
              showAdminToast('⚠️ Product not found or already removed.', 'error');
              return;
            }
            const item = state.customs[idx];
            const name = item.title || item.name || 'this custom gift';
            
            activeDeleteTargetGiftId = item.id;
            const textElem = document.getElementById('admin-confirm-delete-text');
            if (textElem) {
              textElem.innerHTML = `Are you sure you want to delete <strong style="color:#0F172A;">"${escapeHTML(name)}"</strong>?<br><span style="font-size:0.82rem; color:#ef4444; margin-top:6px; display:block;">⚠️ This product will be permanently removed from your catalog.</span>`;
            }
            const modal = document.getElementById('admin-confirm-delete-modal');
            if (modal) {
              modal.style.display = 'flex';
            } else {
              confirmExecuteDeleteGift();
            }
          };

          window.confirmExecuteDeleteGift = function() {
            if (!activeDeleteTargetGiftId) return;
            state = load();
            if (!state.customs || !Array.isArray(state.customs)) return;
            const idx = state.customs.findIndex(item => String(item.id) === String(activeDeleteTargetGiftId));
            if (idx === -1 || !state.customs[idx]) {
              closeAdminConfirmDeleteModal();
              return;
            }
            const item = state.customs[idx];
            const name = item.title || item.name || 'Custom Gift';
            state.customs.splice(idx, 1);
            save(state);
            refreshGiftsTable();
            closeAdminConfirmDeleteModal();
            showAdminToast(`🗑️ "${name}" permanently deleted!`, 'danger');
          };

          window.resetCustomsGiftsToDefaults = function() {
            if (!confirm('⚠️ Are you sure you want to reset all Custom 3D Gifts to the default catalog dataset? This will update all fields and clear legacy options.')) return;
            state = load();
            state.customs = (typeof CUSTOM_GIFTS_CATALOG !== 'undefined' ? JSON.parse(JSON.stringify(CUSTOM_GIFTS_CATALOG)) : []);
            state._customs_version = 2;
            save(state);
            refreshGiftsTable();
            showAdminToast('✅ Custom Gifts catalog reset to default 20 products!');
          };

          // Visual Customization Builder Helper Functions
          let adminColourTags = [];

          window.toggleAdminCustomBlock = function(type) {
            const chk = document.getElementById(`gem-toggle-${type}`);
            const block = document.getElementById(`gem-block-${type}`);
            if (chk && block) {
              block.style.display = chk.checked ? 'block' : 'none';
            }
          };

          window.renderAdminColourTags = function() {
            const wrap = document.getElementById('gem-color-tags-wrap');
            if (!wrap) return;
            wrap.innerHTML = adminColourTags.map((c, i) => `
              <span style="display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; background:#F8FAFC; border:1px solid #CBD5E1; font-size:0.75rem; color:#0F172A; font-weight:700;">
                ${escapeHTML(c)}
                <span onclick="removeAdminColourTag(${i})" style="cursor:pointer; color:#ef4444; font-weight:bold; margin-left:2px;">✕</span>
              </span>
            `).join('');
          };

          window.addAdminColourTag = function() {
            const input = document.getElementById('gem-new-color-input');
            if (input && input.value.trim()) {
              const val = input.value.trim().toUpperCase();
              if (!adminColourTags.includes(val)) {
                adminColourTags.push(val);
                renderAdminColourTags();
              }
              input.value = '';
            }
          };

          window.removeAdminColourTag = function(idx) {
            adminColourTags.splice(idx, 1);
            renderAdminColourTags();
          };

          window.addAdminShapeOptionRow = function(label = '', delta = 0) {
            const wrap = document.getElementById('gem-shape-items-wrap');
            if (!wrap) return;
            const div = document.createElement('div');
            div.className = 'admin-shape-row';
            div.style.cssText = 'display:grid; grid-template-columns:2fr 1fr auto; gap:6px; align-items:center;';
            div.innerHTML = `
              <input type="text" class="shape-opt-label" value="${escapeHTML(label)}" placeholder="e.g. 1 RED HEART" style="padding:5px 8px; font-size:0.8rem; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;">
              <input type="number" class="shape-opt-delta" value="${delta}" placeholder="+₹0" style="padding:5px 8px; font-size:0.8rem; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;">
              <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.admin-shape-row').remove()" style="padding:4px 8px; color:#fff;">🗑️</button>
            `;
            wrap.appendChild(div);
          };

          window.addAdminTextFieldRow = function(label = '', placeholder = '', maxlen = 10, isReq = true) {
            const wrap = document.getElementById('gem-text-fields-wrap');
            if (!wrap) return;
            const div = document.createElement('div');
            div.className = 'admin-text-field-row';
            div.style.cssText = 'background:#FFFFFF; border:1px solid #E2E8F0; border-radius:6px; padding:8px; display:grid; grid-template-columns:2fr 2fr 1fr auto auto; gap:6px; align-items:center;';
            div.innerHTML = `
              <div>
                <label style="font-size:0.7rem; color:#475569; display:block;">Field Label *</label>
                <input type="text" class="tf-label" value="${escapeHTML(label)}" placeholder="e.g. First Name *" style="padding:4px 6px; font-size:0.78rem; width:100%; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;">
              </div>
              <div>
                <label style="font-size:0.7rem; color:#475569; display:block;">Placeholder</label>
                <input type="text" class="tf-placeholder" value="${escapeHTML(placeholder)}" placeholder="e.g. Name seen from LEFT" style="padding:4px 6px; font-size:0.78rem; width:100%; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;">
              </div>
              <div>
                <label style="font-size:0.7rem; color:#475569; display:block;">Max Letters</label>
                <input type="number" class="tf-maxlen" value="${maxlen || 10}" style="padding:4px 6px; font-size:0.78rem; width:100%; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;">
              </div>
              <div style="padding-top:14px;">
                <label style="font-size:0.75rem; color:#0F172A; display:flex; align-items:center; gap:4px; cursor:pointer;">
                  <input type="checkbox" class="tf-req" ${isReq ? 'checked' : ''}> Req
                </label>
              </div>
              <div style="padding-top:14px;">
                <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.admin-text-field-row').remove()" style="padding:3px 6px; font-size:0.75rem; color:#fff;">🗑️</button>
              </div>
            `;
            wrap.appendChild(div);
          };

          window.addAdminGalleryImageInput = function(url = '') {
            const container = document.getElementById('gem-gallery-container');
            if (!container) return;
            const div = document.createElement('div');
            div.className = 'admin-gallery-row';
            div.style.cssText = 'display:flex; gap:8px; align-items:center;';
            div.innerHTML = `
              <img src="${url || 'assets/lithophane.png'}" style="width:36px; height:36px; border-radius:6px; object-fit:cover; border:1px solid #CBD5E1; background:#F1F5F9;" onerror="this.src='assets/lithophane.png'" class="gallery-thumb-prev">
              <input type="text" class="gem-gallery-url" value="${escapeHTML(url)}" placeholder="assets/gifts/dual-name-plank_1.jpg" style="flex:1; padding:6px 10px; font-size:0.82rem; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;" oninput="this.previousElementSibling.src=this.value.trim()||'assets/lithophane.png'">
              <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.admin-gallery-row').remove()" style="padding:4px 8px; color:#fff;">✕</button>
            `;
            container.appendChild(div);
          };

          window.addAdminPhotoUploadRow = function(label = '', isReq = true) {
            const wrap = document.getElementById('gem-photo-fields-wrap');
            if (!wrap) return;
            const div = document.createElement('div');
            div.className = 'admin-photo-field-row';
            div.style.cssText = 'background:#FFFFFF; border:1px solid #E2E8F0; border-radius:6px; padding:8px; display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center;';
            div.innerHTML = `
              <div>
                <label style="font-size:0.7rem; color:#475569; display:block;">Photo Upload Prompt / Label *</label>
                <input type="text" class="pu-label" value="${escapeHTML(label || 'Upload High-Res Photo *')}" placeholder="e.g. Upload Front Photo *" style="padding:5px 8px; font-size:0.8rem; width:100%; background:#FFFFFF; border:1px solid #CBD5E1; color:#0F172A; border-radius:4px;">
              </div>
              <div style="padding-top:14px;">
                <label style="font-size:0.75rem; color:#0F172A; display:flex; align-items:center; gap:4px; cursor:pointer;">
                  <input type="checkbox" class="pu-req" ${isReq ? 'checked' : ''}> Required
                </label>
              </div>
              <div style="padding-top:14px;">
                <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.admin-photo-field-row').remove()" style="padding:3px 6px; font-size:0.75rem; color:#fff;">🗑️</button>
              </div>
            `;
            wrap.appendChild(div);
          };

          // Search listener
          const searchInput = document.getElementById('cg-search-input');
          if (searchInput) {
            searchInput.addEventListener('input', (e) => {
              searchQuery = e.target.value.trim().toLowerCase();
              refreshGiftsTable();
            });
          }

          // Category filter buttons
          document.querySelectorAll('.cg-cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              document.querySelectorAll('.cg-cat-btn').forEach(b => {
                b.style.background = 'transparent';
                b.style.color = '#9ca3af';
              });
              btn.style.background = '#ec4899';
              btn.style.color = '#fff';
              activeCatFilter = btn.getAttribute('data-cat') || 'all';
              refreshGiftsTable();
            });
          });

          // Edit / Add Modal Functions
          window.openGiftEditModal = function(giftIdOrIdx) {
            state = load();
            const overlay = document.getElementById('gift-edit-modal-overlay');
            const title = document.getElementById('gem-modal-title');
            
            let idx = -1;
            if (typeof giftIdOrIdx === 'number') {
              idx = giftIdOrIdx;
            } else if (giftIdOrIdx && giftIdOrIdx !== '-1' && giftIdOrIdx !== -1) {
              idx = (state.customs || []).findIndex(item => String(item.id) === String(giftIdOrIdx));
            }
            document.getElementById('gem-idx').value = idx;

            // Reset dynamic builders
            document.getElementById('gem-gallery-container').innerHTML = '';
            document.getElementById('gem-color-tags-wrap').innerHTML = '';
            document.getElementById('gem-shape-items-wrap').innerHTML = '';
            document.getElementById('gem-text-fields-wrap').innerHTML = '';
            const photoWrap = document.getElementById('gem-photo-fields-wrap');
            if (photoWrap) photoWrap.innerHTML = '';

            if (idx >= 0 && state.customs[idx]) {
              const g = state.customs[idx];
              const pName = g.title || g.name || '';
              title.innerHTML = `<span>✏️</span> <span>Edit: ${escapeHTML(pName)}</span>`;
              document.getElementById('gem-title').value = pName;
              document.getElementById('gem-category').value = g.category || 'anniversary';
              document.getElementById('gem-price').value = g.price || 0;
              document.getElementById('gem-orig-price').value = g.origPrice || g.originalPrice || 0;
              document.getElementById('gem-badge').value = g.badge || '';
              document.getElementById('gem-desc').value = g.desc || g.description || '';
              document.getElementById('gem-rating').value = g.rating || 4.9;
              document.getElementById('gem-reviews').value = g.reviews || g.reviewsCount || 95;

              // Gallery photos
              const gallery = (g.images && g.images.length ? g.images : (g.gallery && g.gallery.length ? g.gallery : [g.img || ''])).filter(Boolean);
              gallery.forEach(url => addAdminGalleryImageInput(url));
              if (!gallery.length) addAdminGalleryImageInput(g.img || '');

              // Customization fields parsing into visual builder
              const fields = g.customizationFields || [];
              
              // 1. Color Field
              const colorField = fields.find(f => f.id === 'color' || f.type === 'pills' && Array.isArray(f.options) && typeof f.options[0] === 'string');
              if (colorField) {
                document.getElementById('gem-toggle-color').checked = true;
                document.getElementById('gem-color-label').value = colorField.label || 'STEP 1 - Colour';
                adminColourTags = Array.isArray(colorField.options) ? colorField.options.map(opt => typeof opt === 'object' ? opt.label : opt) : ['BLUE', 'GOLD', 'PURPLE', 'YELLOW', 'WHITE', 'BLACK', 'RED'];
              } else {
                document.getElementById('gem-toggle-color').checked = false;
                adminColourTags = ['BLUE', 'GOLD', 'PURPLE', 'YELLOW', 'BABY PINK', 'WHITE', 'BLACK', 'SKY BLUE', 'RED', 'GREEN'];
              }
              toggleAdminCustomBlock('color');
              renderAdminColourTags();

              // 2. Shape / Heart Field
              const shapeField = fields.find(f => f.id === 'red_heart' || f.id === 'shape' || (f.label && f.label.toLowerCase().includes('heart')));
              if (shapeField && shapeField.options) {
                document.getElementById('gem-toggle-shape').checked = true;
                document.getElementById('gem-shape-label').value = shapeField.label || 'STEP 2 - Red Heart Option';
                shapeField.options.forEach(opt => {
                  const lbl = typeof opt === 'object' ? opt.label : opt;
                  const delta = typeof opt === 'object' && opt.priceDelta ? opt.priceDelta : (lbl.match(/\+\s*(?:Rs\.?|₹)\s*(\d+)/i) ? parseInt(lbl.match(/\+\s*(?:Rs\.?|₹)\s*(\d+)/i)[1], 10) : 0);
                  addAdminShapeOptionRow(lbl.replace(/\s*\(\+.*\)/, ''), delta);
                });
              } else {
                document.getElementById('gem-toggle-shape').checked = false;
                addAdminShapeOptionRow('0 RED HEART', 0);
                addAdminShapeOptionRow('1 RED HEART', 30);
                addAdminShapeOptionRow('2 RED HEART', 50);
              }
              toggleAdminCustomBlock('shape');

              // 3. Text Fields & Section Header
              const sectionHdr = fields.find(f => f.type === 'section_header');
              if (sectionHdr) document.getElementById('gem-section-header').value = sectionHdr.label;
              
              const textFields = fields.filter(f => f.type === 'text' && f.id !== 'whatsapp');
              if (textFields.length > 0) {
                document.getElementById('gem-toggle-text').checked = true;
                textFields.forEach(tf => addAdminTextFieldRow(tf.label, tf.placeholder, tf.maxlength || 10, tf.required !== false));
              } else {
                document.getElementById('gem-toggle-text').checked = false;
                addAdminTextFieldRow('STEP 4 - First Name on Plank *', 'Name that will be seen from the LEFT', 10, true);
                addAdminTextFieldRow('STEP 5 - Second Name on Plank *', 'Name that will be seen from the RIGHT', 10, true);
              }
              toggleAdminCustomBlock('text');

              // 4. Photo Uploads (Multiple)
              const photoFields = fields.filter(f => f.type === 'file');
              if (photoFields.length > 0) {
                document.getElementById('gem-toggle-photo').checked = true;
                photoFields.forEach(pf => addAdminPhotoUploadRow(pf.label, pf.required !== false));
              } else {
                document.getElementById('gem-toggle-photo').checked = false;
                addAdminPhotoUploadRow('Upload High-Res Photo for 3D Lithophane *', true);
              }
              toggleAdminCustomBlock('photo');

              // 5. WhatsApp Field
              const waField = fields.find(f => f.id === 'whatsapp');
              if (waField) {
                document.getElementById('gem-toggle-whatsapp').checked = true;
                document.getElementById('gem-whatsapp-label').value = waField.label || 'STEP 6 - Whatsapp Number to send DEMO Video';
              } else {
                document.getElementById('gem-toggle-whatsapp').checked = false;
              }
              toggleAdminCustomBlock('whatsapp');

            } else {
              title.innerHTML = `<span>➕</span> <span>Add New Custom Gift Product</span>`;
              document.getElementById('gem-title').value = '';
              document.getElementById('gem-category').value = 'anniversary';
              document.getElementById('gem-price').value = 599;
              document.getElementById('gem-orig-price').value = 899;
              document.getElementById('gem-badge').value = 'New Arrival';
              document.getElementById('gem-desc').value = 'Personalized 3D printed gift crafted with high precision.';
              document.getElementById('gem-rating').value = 4.9;
              document.getElementById('gem-reviews').value = 24;

              addAdminGalleryImageInput('assets/gifts/dual-name-plank_1.jpg');
              adminColourTags = ['BLUE', 'GOLD', 'PURPLE', 'YELLOW', 'WHITE', 'BLACK', 'RED'];
              document.getElementById('gem-toggle-color').checked = true;
              toggleAdminCustomBlock('color');
              renderAdminColourTags();

              document.getElementById('gem-toggle-shape').checked = false;
              toggleAdminCustomBlock('shape');

              document.getElementById('gem-toggle-text').checked = true;
              toggleAdminCustomBlock('text');
              addAdminTextFieldRow('Custom Name / Text *', 'Enter text to 3D print', 12, true);

              document.getElementById('gem-toggle-photo').checked = false;
              toggleAdminCustomBlock('photo');
              addAdminPhotoUploadRow('Upload High-Res Photo for 3D Lithophane *', true);

              document.getElementById('gem-toggle-whatsapp').checked = true;
              toggleAdminCustomBlock('whatsapp');
            }

            overlay.style.display = 'flex';
          };

          window.closeGiftEditModal = function() {
            const overlay = document.getElementById('gift-edit-modal-overlay');
            if (overlay) overlay.style.display = 'none';
          };

          window.handleGiftSave = function(e) {
            e.preventDefault();
            state = load();
            state.customs = state.customs || [];

            const idx = Number(document.getElementById('gem-idx').value);
            const existing = idx >= 0 && state.customs[idx] ? state.customs[idx] : null;

            // Collect all gallery image URLs
            const galleryUrls = [];
            document.querySelectorAll('#gem-gallery-container .gem-gallery-url').forEach(input => {
              const val = input.value.trim();
              if (val) galleryUrls.push(val);
            });
            const mainImgUrl = galleryUrls.length ? galleryUrls[0] : 'assets/gifts/dual-name-plank_1.jpg';

            // Build dynamic customizationFields array strictly based on TICKED options
            const builtFields = [];

            // 1. Color pills
            if (document.getElementById('gem-toggle-color')?.checked && adminColourTags.length) {
              builtFields.push({
                id: 'color',
                label: document.getElementById('gem-color-label')?.value.trim() || 'STEP 1 - Colour',
                type: 'pills',
                options: [...adminColourTags],
                default: adminColourTags[0],
                required: true
              });
            }

            // 2. Shape / Heart pills
            if (document.getElementById('gem-toggle-shape')?.checked) {
              const shapeOptions = [];
              document.querySelectorAll('#gem-shape-items-wrap .admin-shape-row').forEach(row => {
                const lblInput = row.querySelector('.shape-opt-label');
                const deltaInput = row.querySelector('.shape-opt-delta');
                if (lblInput && lblInput.value.trim()) {
                  const lbl = lblInput.value.trim();
                  const delta = Number(deltaInput?.value) || 0;
                  const finalLabel = delta > 0 ? `${lbl} (+ Rs. ${delta}.00)` : lbl;
                  shapeOptions.push({
                    label: finalLabel,
                    priceDelta: delta
                  });
                }
              });
              if (shapeOptions.length) {
                builtFields.push({
                  id: 'red_heart',
                  label: document.getElementById('gem-shape-label')?.value.trim() || 'STEP 2 - Red Heart Option',
                  type: 'pills',
                  options: shapeOptions,
                  default: shapeOptions[0].label,
                  required: true
                });
              }
            }

            // 3. Section Header + Text Fields
            if (document.getElementById('gem-toggle-text')?.checked) {
              const secHdr = document.getElementById('gem-section-header')?.value.trim();
              if (secHdr) {
                builtFields.push({
                  id: 'section_names',
                  label: secHdr,
                  type: 'section_header'
                });
              }

              let tfCount = 0;
              document.querySelectorAll('#gem-text-fields-wrap .admin-text-field-row').forEach(row => {
                const lblInput = row.querySelector('.tf-label');
                const placeholderInput = row.querySelector('.tf-placeholder');
                const maxlenInput = row.querySelector('.tf-maxlen');
                const reqInput = row.querySelector('.tf-req');

                if (lblInput && lblInput.value.trim()) {
                  tfCount++;
                  const maxlen = Number(maxlenInput?.value) || 10;
                  builtFields.push({
                    id: `name_${tfCount}`,
                    label: lblInput.value.trim(),
                    type: 'text',
                    placeholder: placeholderInput?.value.trim() || '',
                    maxlength: maxlen,
                    subtitle: `0/${maxlen} characters`,
                    required: reqInput ? reqInput.checked : true
                  });
                }
              });
            }

            // 4. Photo uploads (Multiple Photo Fields)
            if (document.getElementById('gem-toggle-photo')?.checked) {
              let photoCount = 0;
              document.querySelectorAll('#gem-photo-fields-wrap .admin-photo-field-row').forEach(row => {
                const lblInput = row.querySelector('.pu-label');
                const reqInput = row.querySelector('.pu-req');
                if (lblInput && lblInput.value.trim()) {
                  photoCount++;
                  builtFields.push({
                    id: `photo_${photoCount}`,
                    label: lblInput.value.trim(),
                    type: 'file',
                    required: reqInput ? reqInput.checked : true
                  });
                }
              });
            }

            // 5. WhatsApp field
            if (document.getElementById('gem-toggle-whatsapp')?.checked) {
              builtFields.push({
                id: 'whatsapp',
                label: document.getElementById('gem-whatsapp-label')?.value.trim() || 'STEP 6 - Whatsapp Number to send DEMO Video',
                type: 'text',
                placeholder: 'Enter the WHATSAPP Number',
                required: false
              });
            }

            const giftObj = {
              id: existing ? existing.id : `gift-${Date.now()}`,
              title: document.getElementById('gem-title').value.trim(),
              name: document.getElementById('gem-title').value.trim(),
              category: document.getElementById('gem-category').value,
              price: Number(document.getElementById('gem-price').value) || 0,
              origPrice: Number(document.getElementById('gem-orig-price').value) || 0,
              originalPrice: Number(document.getElementById('gem-orig-price').value) || 0,
              badge: document.getElementById('gem-badge').value.trim(),
              img: mainImgUrl,
              images: galleryUrls.length ? galleryUrls : [mainImgUrl],
              gallery: galleryUrls.length ? galleryUrls : [mainImgUrl],
              desc: document.getElementById('gem-desc').value.trim(),
              description: document.getElementById('gem-desc').value.trim(),
              rating: Number(document.getElementById('gem-rating').value) || 4.9,
              reviews: Number(document.getElementById('gem-reviews').value) || 50,
              reviewsCount: Number(document.getElementById('gem-reviews').value) || 50,
              customizationFields: builtFields
            };

            if (idx >= 0 && state.customs[idx]) {
              state.customs[idx] = giftObj;
            } else {
              state.customs.push(giftObj);
            }

            save(state);
            closeGiftEditModal();
            refreshGiftsTable();
            showAdminToast('✅ Custom Gift product saved successfully!');
          };

          refreshGiftsTable();
        }

      window.refreshAdminOrders = function() {
        const activeTab = document.querySelector('.tabs button.active')?.getAttribute('data-section');
        if (activeTab === 'orders') {
          renderOrders(document.getElementById('content'));
        }
      };

      window.downloadStlModel = function(orderId, fileName, customDataUrl) {
        let dataUrl = customDataUrl;
        let name = fileName || 'model.stl';

        if (!dataUrl && orderId) {
          const stock = load();
          const order = (stock.orders || []).find(o => o.orderId === orderId);
          if (order && order.items) {
            const match = order.items.find(it => 
              (it.fileName && it.fileName === fileName) || 
              (it.name && it.name.includes(fileName)) || 
              it.fileDataUrl
            );
            if (match && match.fileDataUrl) {
              dataUrl = match.fileDataUrl;
            }
          }
        }

        if (!dataUrl) {
          const safeName = name.replace(/[^a-zA-Z0-9]/g, '_');
          const stlAscii = `solid ${safeName}\nfacet normal 0 0 1\nouter loop\nvertex 0 0 0\nvertex 25 0 0\nvertex 0 25 0\nendloop\nendfacet\nfacet normal 0 0 1\nouter loop\nvertex 25 0 0\nvertex 25 25 0\nvertex 0 25 0\nendloop\nendfacet\nendsolid ${safeName}`;
          dataUrl = 'data:model/stl;charset=utf-8,' + encodeURIComponent(stlAscii);
        }

        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = name.endsWith('.stl') ? name : `${name}.stl`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 250);
      };

      window.previewOrderPhoto = function(orderId, itemIdx) {
        const stock = load();
        const order = (stock.orders || []).find(o => o.orderId === orderId);
        if (order && order.items && order.items[itemIdx] && order.items[itemIdx].photoDataUrl) {
          const w = window.open('');
          if (w) {
            w.document.write(`<title>Customer Uploaded Photo - ${escapeHTML(orderId)}</title><body style="margin:0; background:#111; display:flex; justify-content:center; align-items:center; min-height:100vh;"><img src="${order.items[itemIdx].photoDataUrl}" style="max-width:90vw; max-height:90vh; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.8);"></body>`);
          }
        } else {
          alert('No photo preview stored for this item.');
        }
      };

      document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>{
        renderSection(b.getAttribute('data-section'));
      }));

      // Live update admin orders when customer places order in another tab
      window.addEventListener('storage', (e) => {
        if (e.key === 'dl3d_stock_v1') {
          const activeTab = document.querySelector('.tabs button.active')?.getAttribute('data-section');
          if (activeTab === 'orders') {
            renderOrders(document.getElementById('content'));
          }
        }
      });

      renderSection('filaments');
    }

    (async ()=>{
      if(await ensureAuth()) startAdmin();
    })();
  </script>
</body>
</html>
